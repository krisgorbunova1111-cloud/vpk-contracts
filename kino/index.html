<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Кино и сериалы</title>
<style>
:root{
  --bg1:#15141c; --bg2:#101017; --bg3:#161620;
  --card:rgba(35,33,46,.55); --card2:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.08); --text:#eceaf2; --muted:#948fa6; --muted2:#726d84;
  --pink:#e0729a; --pink-d:rgba(224,114,154,.14);
  --orange:#d99a5b; --orange-d:rgba(217,154,91,.14);
  --yellow:#d9c15b; --yellow-d:rgba(217,193,91,.14);
  --teal:#4fbfa8; --teal-d:rgba(79,191,168,.14);
  --purple:#8b7bc7; --purple-d:rgba(139,123,199,.14);
  --blue:#6b9fc2; --blue-d:rgba(107,159,194,.14);
  --green:#6bbf8f; --green-d:rgba(107,191,143,.14);
  --gray:#8b86a0; --gray-d:rgba(139,134,160,.12);
  --red:#d9707f;
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --sunset:linear-gradient(135deg,#d9808f,#d9a25b);
  --cosmic:linear-gradient(135deg,#7d6bb5,#c47593);
  --header-bg:rgba(15,10,31,.85); --modal-bg:linear-gradient(160deg,#2a1a45,#1a0f2e);
  --overlay-bg:rgba(10,6,20,.7); --scrollbar:#4a3a70; --track:rgba(255,255,255,.07);
  --star-off:rgba(255,255,255,.15); --confirm-bg:rgba(15,8,28,.96);
}
:root[data-theme="light"]{
  --bg1:#f6f3fa; --bg2:#ffffff; --bg3:#f3eff8;
  --card:rgba(255,255,255,.75); --card2:rgba(20,10,40,.045);
  --border:rgba(20,10,40,.1); --text:#2a2436; --muted:#6e6780; --muted2:#948da3;
  --pink:#b8456f; --pink-d:rgba(184,69,111,.12);
  --orange:#a06a2c; --orange-d:rgba(160,106,44,.12);
  --yellow:#8a7620; --yellow-d:rgba(138,118,32,.12);
  --teal:#1f8a76; --teal-d:rgba(31,138,118,.12);
  --purple:#6a55a8; --purple-d:rgba(106,85,168,.12);
  --blue:#3d7ba3; --blue-d:rgba(61,123,163,.12);
  --green:#3c8f62; --green-d:rgba(60,143,98,.12);
  --gray:#6b6478; --gray-d:rgba(107,100,120,.1);
  --red:#c14456;
  --shadow:0 4px 16px rgba(20,10,40,.08);
  --header-bg:rgba(255,255,255,.85); --modal-bg:linear-gradient(160deg,#ffffff,#f3eff8);
  --overlay-bg:rgba(40,30,60,.35); --scrollbar:rgba(20,10,40,.15); --track:rgba(20,10,40,.06);
  --star-off:rgba(20,10,40,.15); --confirm-bg:rgba(255,255,255,.97);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:
  radial-gradient(circle at 15% 0%,rgba(139,123,199,.09),transparent 45%),
  radial-gradient(circle at 85% 15%,rgba(224,114,154,.07),transparent 40%),
  linear-gradient(180deg,var(--bg1),var(--bg2) 40%,var(--bg3));
  background-attachment:fixed;
  color:var(--text);min-height:100vh;padding-bottom:60px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}

header{position:sticky;top:0;z-index:20;background:var(--header-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto;}
.title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text);}
.title .em{opacity:.9;}
.theme-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex:none;}
.theme-btn:hover{border-color:var(--muted);}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--gray);transition:background .3s;}
.sync .dot.ok{background:var(--teal);box-shadow:0 0 6px var(--teal);}
.sync .dot.err{background:var(--red);}
.sync .dot.busy{background:var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.toolbar{max-width:1100px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.search-wrap{flex:1 1 200px;position:relative;}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;outline:none;}
.search-wrap input:focus{border-color:var(--pink);}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);}
select.sortsel{padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;outline:none;}
.btn-add{background:var(--cosmic);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;}
.btn-add:active{transform:scale(.97);}

.tabs{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.tab{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab.active{background:rgba(224,114,154,.16);color:var(--pink);border-color:rgba(224,114,154,.4);}

.chips{max-width:1100px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;}
.chip{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.chip .cnt{background:rgba(255,255,255,.1);border-radius:10px;padding:1px 6px;font-size:11px;}
.chip.active{border-color:var(--pink);color:var(--pink);background:var(--pink-d);}

.stats{max-width:1100px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px);}
.stat:nth-child(1) .n{color:var(--pink);}
.stat:nth-child(2) .n{color:var(--blue);}
.stat:nth-child(3) .n{color:var(--green);}
.stat:nth-child(4) .n{color:var(--purple);}
.stat:nth-child(5) .n{color:var(--orange);}
.stat:nth-child(6) .n{color:var(--yellow);}
.stat:nth-child(7) .n{color:var(--teal);}
.stat .n{font-size:19px;font-weight:800;}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;}

main{max-width:1100px;margin:0 auto;padding:16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}

.card{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--card-accent,var(--purple));border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s;backdrop-filter:blur(10px);}
.card:hover{border-color:rgba(255,255,255,.16);transform:translateY(-1px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-size:15px;font-weight:700;line-height:1.3;cursor:pointer;}
.card-title:hover{color:var(--pink);}
.card-actions{display:flex;gap:4px;flex:none;}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.icon-btn:hover{color:var(--text);border-color:var(--muted);}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red);}

.badges{display:flex;flex-wrap:wrap;gap:6px;}
.badge{font-size:11px;padding:3px 9px;border-radius:8px;font-weight:700;white-space:nowrap;}
.badge.type-movie{background:var(--orange-d);color:var(--orange);}
.badge.type-series{background:var(--blue-d);color:var(--blue);}
.badge.status-want{background:var(--gray-d);color:var(--gray);}
.badge.status-watching{background:var(--teal-d);color:var(--teal);}
.badge.status-waiting_season{background:var(--yellow-d);color:var(--yellow);}
.badge.status-completed{background:var(--green-d);color:var(--green);}
.badge.status-paused{background:var(--purple-d);color:var(--purple);}

.note{font-size:12px;color:var(--muted2);line-height:1.4;}

.progress-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.progress-bar{flex:1;height:6px;border-radius:4px;background:var(--track);overflow:hidden;}
.progress-fill{height:100%;background:var(--card-accent,var(--purple));border-radius:4px;transition:width .3s;}
.progress-num{white-space:nowrap;font-variant-numeric:tabular-nums;}
.watch-controls{display:flex;align-items:center;gap:4px;}
.watch-controls button{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-size:13px;line-height:1;}
.watch-controls button:hover{border-color:var(--pink);color:var(--pink);}
.watch-controls input{width:44px;background:transparent;border:none;color:var(--text);text-align:center;font-size:12px;outline:none;}

.stars{display:flex;gap:2px;}
.stars span{cursor:pointer;font-size:17px;color:var(--star-off);user-select:none;}
.stars span.on{color:var(--yellow);}

.status-select{margin-top:2px;width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px;outline:none;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .em{font-size:40px;margin-bottom:10px;}

.modal-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{background:var(--modal-bg);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);}
@media(min-width:640px){.modal{border-radius:16px;}}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--text);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=month],.field textarea,.field select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pink);}
.field textarea{resize:vertical;min-height:50px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-toggle{display:flex;gap:8px;}
.type-toggle button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;}
.type-toggle button.on{background:var(--cosmic);color:#fff;border-color:transparent;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
.btn.primary{background:var(--cosmic);color:#fff;}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}

.confirm-del{position:absolute;inset:0;background:var(--confirm-bg);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;z-index:5;}
.confirm-del div{font-size:13px;text-align:center;}
.confirm-del .row{display:flex;gap:8px;width:100%;}

.badge.due-soon{background:var(--teal-d);color:var(--teal);}
.badge.due-over{background:var(--pink-d);color:var(--pink);}
.badge.due-later{background:var(--card2);color:var(--muted);}
</style>
</head>

<main>

function isLight(){return document.documentElement.getAttribute('data-theme')==='light';}
function statusAccent(status){const m=isLight()?STATUS_ACCENT_LIGHT:STATUS_ACCENT_DARK;return m[status]||m.want;}

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function genreColor(g){
  if(!g)return isLight()?{bg:'rgba(20,10,40,.04)',fg:'#6e6780'}:{bg:'rgba(255,255,255,.05)',fg:'#948fa6'};
  const pal=isLight()?GENRE_PALETTE_LIGHT:GENRE_PALETTE_DARK;
  return pal[hashStr(g)%pal.length];
}

const MONTH_RU=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function dueInfo(due){
  if(!due)return null;
  const [y,m]=due.split('-').map(Number);
  const now=new Date();
  const monthsDiff=(y-now.getFullYear())*12+(m-1-now.getMonth());
  const label=MONTH_RU[m-1]+' '+y;
  let cls='due-later';
  if(monthsDiff<=0)cls='due-over';
  else if(monthsDiff<=3)cls='due-soon';
  return {label,cls,monthsDiff};

let items=[];
let state={type:'all',status:'all',search:'',sort:'title'};
let pushTimer=null;
let confirmDelId=null;

function uid(){return Date.now()+Math.floor(Math.random()*1000);}

function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const d=JSON.parse(raw); if(d&&d.length) return d;}
  }catch(e){}
  return null;
}
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(items));}catch(e){}
}

function setSyncStatus(kind,msg){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  dot.className='dot '+kind;
  txt.textContent=msg;
}

function mergeRemote(remote){
  if(!remote||!remote.length)return;
  const remoteMap={};
  remote.forEach(r=>remoteMap[String(r.id)]=r);
  items=items.map(it=>{
    const r=remoteMap[String(it.id)];
    return r?Object.assign({},it,r):it;
  });
  const localIds=new Set(items.map(it=>String(it.id)));
  remote.forEach(r=>{if(!localIds.has(String(r.id)))items.push(r);});
}

function fetchRemote(){
  setSyncStatus('busy','Синхронизация…');
  fetch(SUPABASE_URL+'/rest/v1/storage?select=key,value&key=eq.'+REMOTE_KEY,{
    headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
  }).then(r=>r.json()).then(rows=>{
    if(rows&&rows.length&&rows[0].value){
      const parsed=JSON.parse(rows[0].value);
      if(parsed&&parsed.length){
        mergeRemote(parsed);
        saveLocal();
        render();
        setSyncStatus('ok','Синхронизировано');
        return;
      }
    }
    pushRemote(true);
    setSyncStatus('ok','Локальные данные');
  }).catch(()=>setSyncStatus('err','Нет соединения'));
}

function pushRemote(immediate){
  if(pushTimer)clearTimeout(pushTimer);
  const fn=()=>{
    const body=JSON.stringify({key:REMOTE_KEY,value:JSON.stringify(items)});
    fetch(SUPABASE_URL+'/rest/v1/storage',{
      method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
      body:body
    }).then(r=>{if(r.ok)setSyncStatus('ok','Сохранено ☁️'); else setSyncStatus('err','Ошибка сохранения');})
      .catch(()=>setSyncStatus('err','Нет соединения'));
  };
  if(immediate)fn(); else pushTimer=setTimeout(fn,900);
}

function persist(){saveLocal();pushRemote();}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function setSearch(v){state.search=v;render();}
function setSort(v){state.sort=v;render();}
function setType(v){state.type=v;render();}
function setStatusFilter(v){state.status=v;render();}

function genreList(){
  const set=new Set(items.map(it=>it.genre).filter(Boolean));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ru'));
}

function filtered(){
  let list=items.slice();
  if(state.type!=='all')list=list.filter(it=>it.type===state.type);
  if(state.status!=='all')list=list.filter(it=>it.status===state.status);
  if(state.search.trim())list=list.filter(it=>it.title.toLowerCase().includes(state.search.trim().toLowerCase()));
  if(state.sort==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'ru'));
  else if(state.sort==='rating')list.sort((a,b)=>(b.rating||0)-(a.rating||0)||a.title.localeCompare(b.title,'ru'));
  else if(state.sort==='progress')list.sort((a,b)=>progressPct(b)-progressPct(a)||a.title.localeCompare(b.title,'ru'));
  else if(state.sort==='due')list.sort((a,b)=>{
    if(!a.due&&!b.due)return a.title.localeCompare(b.title,'ru');
    if(!a.due)return 1;
    if(!b.due)return -1;
    return a.due.localeCompare(b.due)||a.title.localeCompare(b.title,'ru');
  });
  return list;
}

function progressPct(it){
  const total=Number(it.total)||0, watched=Number(it.watched)||0;
  if(!total)return 0;
  return Math.max(0,Math.min(100,Math.round(watched/total*100)));
}

function renderTabs(){
  const counts={all:items.length,series:items.filter(i=>i.type==='series').length,movie:items.filter(i=>i.type==='movie').length};
  const defs=[['all','Всё'],['series','📺 Сериалы'],['movie','🎬 Фильмы']];
  document.getElementById('tabs').innerHTML=defs.map(([k,l])=>
    `<button class="tab ${state.type===k?'active':''}" onclick="setType('${k}')">${l} (${counts[k]})</button>`
  ).join('');
}

function renderChips(){
  const base=state.type==='all'?items:items.filter(i=>i.type===state.type);
  const counts={all:base.length};
  STATUS_ORDER.forEach(s=>counts[s]=base.filter(i=>i.status===s).length);
  const defs=[['all','Все']].concat(STATUS_ORDER.map(s=>[s,STATUS_LABEL[s]]));
  document.getElementById('chips').innerHTML=defs.map(([k,l])=>
    `<button class="chip ${state.status===k?'active':''}" onclick="setStatusFilter('${k}')">${l}<span class="cnt">${counts[k]||0}</span></button>`
  ).join('');
}

function renderStats(){
  const base=state.type==='all'?items:items.filter(i=>i.type==='series'?i.type===state.type:i.type===state.type);
  const list=state.type==='all'?items:items.filter(i=>i.type===state.type);
  const totalEp=list.reduce((s,i)=>s+(Number(i.total)||0),0);
  const watchedEp=list.reduce((s,i)=>s+(Number(i.watched)||0),0);
  const pct=totalEp?Math.round(watchedEp/totalEp*100):0;
  const stats=[
    ['Всего',list.length],
    ['Смотрю',list.filter(i=>i.status==='watching').length],
    ['Досмотрено',list.filter(i=>i.status==='completed').length],
    ['Хочу посмотреть',list.filter(i=>i.status==='want').length],
    ['Ждём продолжения',list.filter(i=>i.status==='waiting_season').length],
    ['Серий просмотрено',watchedEp+' / '+totalEp],
    ['% завершено',pct+'%'],
  ];
  document.getElementById('stats').innerHTML=stats.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function starsHtml(it){
  let h='<div class="stars">';
  for(let i=1;i<=5;i++){
    h+=`<span class="${i<=(it.rating||0)?'on':''}" onclick="setRating(${it.id},${i})">★</span>`;
  }
  h+='</div>';
  return h;
}

function cardHtml(it){
  const pct=progressPct(it);
  const isMovie=it.type==='movie';
  const total=it.total==null?'':it.total;
  const watched=it.watched==null?0:it.watched;
  const accent=statusAccent(it.status);
  const gc=genreColor(it.genre);
  const di=dueInfo(it.due);
  return `<div class="card" id="card-${it.id}" style="--card-accent:${accent}">
    <div class="card-top">
      <div class="card-title" onclick="openModal(${it.id})">${esc(it.title)}</div>
      <div class="card-actions">
        <button class="icon-btn" onclick="openModal(${it.id})" title="Изменить">✎</button>
        <button class="icon-btn danger" onclick="askDelete(${it.id})" title="Удалить">🗑</button>
      </div>
    </div>
    <div class="badges">
      <span class="badge ${isMovie?'type-movie':'type-series'}">${isMovie?'🎬 Фильм':'📺 Сериал'}</span>
      ${it.genre?`<span class="badge" style="background:${gc.bg};color:${gc.fg}">${esc(it.genre)}</span>`:''}
      ${di?`<span class="badge ${di.cls}">${di.cls==='due-over'?'⏰ уже пора · ':(di.cls==='due-soon'?'🔜 скоро · ':'')}${di.label}</span>`:''}
    </div>
    <select class="status-select" onchange="setStatus(${it.id},this.value)">
      ${STATUS_ORDER.map(s=>`<option value="${s}" ${it.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
    </select>
    ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-num">${pct}%</div>
    </div>
    <div class="progress-row">
      <div class="watch-controls">
        <button onclick="stepWatched(${it.id},-1)">−</button>
        <input type="number" value="${watched}" onchange="editWatched(${it.id},this.value)">
        <span>/</span>
        <input type="number" value="${total}" onchange="editTotal(${it.id},this.value)" style="width:44px">
        <button onclick="stepWatched(${it.id},1)">+</button>
      </div>
      ${starsHtml(it)}
    </div>
    <div id="confirm-${it.id}"></div>
  </div>`;
}

function render(){
  renderTabs();
  renderChips();
  renderStats();
  const list=filtered();
  const grid=document.getElementById('grid');
  if(!list.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="em">🍿</div>Ничего не найдено</div>`;
  }else{
    grid.innerHTML=list.map(cardHtml).join('');
  }
}

function findItem(id){return items.find(it=>String(it.id)===String(id));}

function setRating(id,n){
  const it=findItem(id); if(!it)return;
  it.rating=(it.rating===n)?n:n;
  render();persist();
}
function setStatus(id,status){
  const it=findItem(id); if(!it)return;
  it.status=status;
  render();persist();
}
function stepWatched(id,delta){
  const it=findItem(id); if(!it)return;
  let w=(Number(it.watched)||0)+delta;
  if(w<0)w=0;
  const total=Number(it.total)||0;
  if(total&&w>total)w=total;
  it.watched=w;
  render();persist();
}
function editWatched(id,val){
  const it=findItem(id); if(!it)return;
  let w=Math.max(0,Number(val)||0);
  it.watched=w;
  render();persist();
}
function editTotal(id,val){
  const it=findItem(id); if(!it)return;
  it.total=Math.max(0,Number(val)||0);
  render();persist();
}

function askDelete(id){
  const el=document.getElementById('confirm-'+id);
  if(!el)return;
  el.parentElement.insertAdjacentHTML('beforeend',`<div class="confirm-del"><div>Удалить «${esc(findItem(id).title)}»?</div><div class="row"><button class="btn ghost" onclick="render()">Отмена</button><button class="btn danger" onclick="deleteItem(${id})">Удалить</button></div></div>`);
}
function deleteItem(id){
  items=items.filter(it=>String(it.id)!==String(id));
  render();persist();
}

function openModal(id){
  const it=id?findItem(id):null;
  const data=it||{id:uid(),type:'series',title:'',genre:'',note:'',watched:0,total:0,status:'want',rating:0,due:null};
  const genres=genreList();
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${it?'Изменить':'Добавить'}</h3>
      <div class="field">
        <label>Тип</label>
        <div class="type-toggle">
          <button type="button" id="type-series" class="${data.type==='series'?'on':''}" onclick="pickType('series')">📺 Сериал</button>
          <button type="button" id="type-movie" class="${data.type==='movie'?'on':''}" onclick="pickType('movie')">🎬 Фильм</button>
        </div>
      </div>
      <div class="field">
        <label>Название</label>
        <input type="text" id="f-title" value="${esc(data.title)}" placeholder="Название">
      </div>
      <div class="field">
        <label>Жанр</label>
        <input type="text" id="f-genre" list="genre-list" value="${esc(data.genre)}" placeholder="Аниме, Драма…">
        <datalist id="genre-list">${genres.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
      </div>
      <div class="field">
        <label>Статус</label>
        <select id="f-status">
          ${STATUS_ORDER.map(s=>`<option value="${s}" ${data.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label>Просмотрено серий</label>
          <input type="number" id="f-watched" value="${data.watched==null?0:data.watched}" min="0">
        </div>
        <div class="field">
          <label>Всего серий</label>
          <input type="number" id="f-total" value="${data.total==null?0:data.total}" min="0">
        </div>
      </div>
      <div class="field">
        <label>Ожидаемая дата выхода</label>
        <input type="month" id="f-due" value="${data.due||''}">
      </div>
      <div class="field">
        <label>Оценка</label>
        <div id="f-stars">${starsEditHtml(data.rating||0)}</div>
      </div>
      <div class="field">
        <label>Заметка</label>
        <textarea id="f-note" placeholder="Когда выйдет продолжение и т.п.">${esc(data.note)}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary" onclick="saveModal(${it?data.id:'null'})">Сохранить</button>
      </div>
    </div>
  </div>`;
  window._modalType=data.type;
  window._modalRating=data.rating||0;
}

function pickType(t){
  window._modalType=t;
  document.getElementById('type-series').className=t==='series'?'on':'';
  document.getElementById('type-movie').className=t==='movie'?'on':'';
}

function starsEditHtml(rating){
  let h='<div class="stars">';
  for(let i=1;i<=5;i++){
    h+=`<span class="${i<=rating?'on':''}" onclick="pickRating(${i})">★</span>`;
  }
  h+='</div>';
  return h;
}
function pickRating(n){
  window._modalRating=n;
  document.getElementById('f-stars').innerHTML=starsEditHtml(n);
}

function closeModal(){document.getElementById('modal-root').innerHTML='';}

function saveModal(existingId){
  const title=document.getElementById('f-title').value.trim();
  if(!title){alert('Введите название');return;}
  const genre=document.getElementById('f-genre').value.trim();
  const status=document.getElementById('f-status').value;
  const watched=Math.max(0,Number(document.getElementById('f-watched').value)||0);
  const total=Math.max(0,Number(document.getElementById('f-total').value)||0);
  const note=document.getElementById('f-note').value.trim();
  const due=document.getElementById('f-due').value||null;
  const type=window._modalType||'series';
  const rating=window._modalRating||0;

  if(existingId){
    const it=findItem(existingId);
    Object.assign(it,{title,genre,status,watched,total,note,type,rating,due});
  }else{
    items.push({id:uid(),title,genre,status,watched,total,note,type,rating,due});
  }
  closeModal();render();persist();
}

function backfillDue(){
  const initMap={};
  INITIAL_DATA.forEach(d=>initMap[d.id]=d.due);
  let changed=false;
  items.forEach(it=>{
    if(!('due' in it)){
      it.due=initMap[it.id]||null;
      changed=true;
    }
  });
  if(changed)saveLocal();
}

function init(){
  initTheme();
  const local=loadLocal();
  items=local?local:JSON.parse(JSON.stringify(INITIAL_DATA));
  backfillDue();
  render();
  fetchRemote();
}
init();
</script>
</body>
</html>
