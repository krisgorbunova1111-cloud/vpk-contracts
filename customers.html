<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заказчики — ВПК</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a5f;--blue:#2563eb;--blue-lt:rgba(37,99,235,.1);
  --tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;
  --surf:#fff;--surf2:#f8fafc;--surf3:#f1f5f9;
  --bdr:#e2e8f0;--bdr2:#cbd5e1;
  --grn:#16a34a;--grn-bg:#dcfce7;
  --org:#ea580c;--org-bg:#fff7ed;
  --red:#dc2626;--red-bg:#fee2e2;
  --yel:#ca8a04;--yel-bg:#fef9c3;
  --pur:#7c3aed;--pur-bg:#ede9fe;
  --sel:#eff6ff;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--surf3);color:var(--tx);font-size:13px}

/* ── App shell ── */
.app{display:flex;flex-direction:column;height:100%}

/* ── Topbar ── */
.hdr{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-brand{font-size:15px;font-weight:700;white-space:nowrap}
.hdr-brand span{color:#60a5fa}
.hdr-tiles{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tile{background:rgba(255,255,255,.1);border-radius:8px;padding:5px 13px;text-align:center;min-width:86px}
.tile-val{font-size:17px;font-weight:700;line-height:1.2}
.tile-lbl{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.4px}
.tile.grn .tile-val{color:#86efac}
.tile.red .tile-val{color:#fca5a5}
.tile.org .tile-val{color:#fdba74}
.tile.pur .tile-val{color:#c4b5fd}

/* ── Split layout ── */
.split{display:flex;flex:1;min-height:0}

/* ── LEFT panel ── */
.left-panel{width:310px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;min-height:0}
.left-head{padding:10px 12px 8px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.search-row{display:flex;gap:6px}
.fi-search{flex:1;border:1px solid var(--bdr);border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit;color:var(--tx);background:var(--surf2);outline:none}
.fi-search:focus{border-color:var(--blue);background:var(--surf)}
.btn-add{padding:6px 11px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:#1d4ed8}
.left-filters{padding:6px 12px 8px;border-bottom:1px solid var(--bdr);display:flex;gap:5px;flex-wrap:wrap}
.fi-sm{border:1px solid var(--bdr);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--surf2);outline:none;cursor:pointer}
.fi-sm:focus{border-color:var(--blue)}
.ctr-list{flex:1;overflow-y:auto;padding-bottom:12px}
.group-hd{padding:8px 12px 4px;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:2;border-bottom:1px solid var(--bdr)}
.group-count{background:var(--surf3);color:var(--tx3);border-radius:99px;padding:1px 6px;font-size:10px;font-weight:600}
.ctr-item{display:flex;align-items:flex-start;gap:7px;padding:8px 12px;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.ctr-item:hover{background:var(--surf3)}
.ctr-item.active{background:var(--sel);border-left-color:var(--blue)}
.ctr-item.active .ci-num{color:var(--blue)}
.sign-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sign-dot.yes{background:var(--grn)}
.sign-dot.no{background:var(--bdr2)}
.ci-body{flex:1;min-width:0}
.ci-num{font-size:10px;font-weight:600;color:var(--tx2);margin-bottom:1px}
.ci-obj{font-size:12px;color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:10px;color:var(--tx3);margin-top:1px}
.ci-badges{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.ci-sum{font-size:10px;font-weight:600;color:var(--tx2);margin-top:2px}
.mini-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
.mb-gge{background:var(--grn-bg);color:var(--grn)}
.mb-gge-pend{background:var(--yel-bg);color:var(--yel)}
.mb-exon{background:var(--pur-bg);color:var(--pur)}
.mb-ds{background:var(--blue-lt);color:var(--blue)}
.mb-pf{background:var(--red-bg);color:var(--red)}

/* ── RIGHT panel ── */
.right-panel{flex:1;min-width:0;overflow-y:auto;background:var(--surf3)}
.empty-state{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--tx3)}
.empty-state .es-icon{font-size:40px;opacity:.3}
.empty-state p{font-size:13px}

/* ── Detail head ── */
.detail-head{background:var(--navy);color:#fff;padding:14px 20px 12px;display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;z-index:10}
.dh-main{flex:1;min-width:0}
.dh-num{font-size:14px;font-weight:700;margin-bottom:3px}
.dh-meta{font-size:11px;opacity:.65;display:flex;gap:8px;flex-wrap:wrap}
.dh-actions{display:flex;gap:5px;flex-shrink:0}
.dh-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;border:none}
.dh-btn.edit{background:rgba(255,255,255,.15);color:#fff}
.dh-btn.edit:hover{background:rgba(255,255,255,.25)}
.dh-btn.del{background:rgba(220,38,38,.35);color:#fff}
.dh-btn.del:hover{background:rgba(220,38,38,.55)}

/* ── Summary bar ── */
.sum-bar{display:flex;background:var(--surf);border-bottom:1px solid var(--bdr)}
.sum-cell{flex:1;padding:9px 16px;text-align:center;border-right:1px solid var(--bdr)}
.sum-cell:last-child{border-right:none}
.sum-val{font-size:15px;font-weight:700;line-height:1.2}
.sum-val.grn{color:var(--grn)}
.sum-val.red{color:var(--red)}
.sum-val.yel{color:var(--yel)}
.sum-lbl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* ── Progress bars ── */
.prog-wrap{padding:10px 20px 0;background:var(--surf);border-bottom:1px solid var(--bdr)}
.prog-track{height:6px;background:var(--bdr);border-radius:99px;overflow:hidden;margin-bottom:5px}
.prog-fill{height:100%;border-radius:99px;transition:width .4s}
.prog-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);padding-bottom:8px}

/* ── Card sections ── */
.sections{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.card-hd{padding:8px 14px;background:var(--surf2);border-bottom:1px solid var(--bdr);font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between}
.card-hd-btn{font-size:11px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
.card-hd-btn:hover{text-decoration:underline}
.field{display:flex;align-items:flex-start;padding:7px 14px;gap:12px;border-bottom:1px solid var(--bdr)}
.field:last-child{border-bottom:none}
.field-lbl{width:110px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--tx3);padding-top:2px}
.field-val{flex:1;min-width:0;font-size:12px;color:var(--tx)}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;white-space:nowrap}
.b-signed{background:var(--grn-bg);color:var(--grn)}
.b-nosign{background:var(--red-bg);color:var(--red)}
.b-yes{background:var(--grn-bg);color:var(--grn);cursor:pointer;border:none;font-family:inherit}
.b-no{background:var(--surf3);color:var(--tx3);cursor:pointer;border:none;font-family:inherit}
.b-partial{background:var(--org-bg);color:var(--org)}
.b-review{background:var(--yel-bg);color:var(--yel)}
.b-pf{background:var(--red-bg);color:var(--red);font-weight:700}
.b-gray{background:var(--surf3);color:var(--tx3)}
.b-btn{cursor:pointer;border:none;font-family:inherit;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600}
.b-pur{background:var(--pur-bg);color:var(--pur)}
.b-grn{background:var(--grn-bg);color:var(--grn)}
.b-yel{background:var(--yel-bg);color:var(--yel)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-lt);color:var(--blue)}

/* ── Select/input inside field ── */
.sel-sm{border:1px solid var(--bdr);border-radius:5px;padding:3px 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--surf2);outline:none;cursor:pointer}
.sel-sm:focus{border-color:var(--blue)}
.inp-sm{border:1px solid var(--bdr);border-radius:5px;padding:3px 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--surf2);outline:none;width:130px}
.inp-sm:focus{border-color:var(--blue)}
.inp-sm.filled{border-color:#93c5fd;background:rgba(37,99,235,.04)}
.inp-sum-d{width:150px;border:1px solid var(--bdr);border-radius:5px;padding:4px 7px;font-size:12px;text-align:right;font-family:inherit;color:var(--tx);background:var(--surf2);outline:none}
.inp-sum-d:focus{border-color:var(--blue)}
.inp-sum-d.has-val{border-color:#93c5fd;background:rgba(37,99,235,.04);font-weight:600;color:var(--blue)}
.cmt-area{width:100%;border:none;resize:none;padding:10px 14px;font-size:12px;font-family:inherit;color:var(--tx);background:transparent;outline:none;min-height:52px}
.cmt-area::placeholder{color:var(--tx3)}
.ext-link{color:var(--blue);text-decoration:none;font-size:11px}
.ext-link:hover{text-decoration:underline}
.overdue{color:var(--red);font-weight:600}
.no-date{color:var(--tx3);font-style:italic}

/* ── Budget bar ── */
.budget-block{padding:10px 14px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--bdr)}
.budget-block:last-child{border-bottom:none}
.b-track-row{display:flex;align-items:center;gap:8px}
.b-track{flex:1;height:7px;background:var(--bdr);border-radius:99px;overflow:hidden}
.b-fill{height:100%;border-radius:99px;transition:width .4s}
.b-fill.ok{background:var(--grn)}
.b-fill.warn{background:var(--yel)}
.b-fill.over{background:var(--red)}
.b-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right}
.b-pct.ok{color:var(--grn)}
.b-pct.warn{color:var(--yel)}
.b-pct.over{color:var(--red)}
.b-nums{font-size:10px;color:var(--tx3);display:flex;gap:8px}
.b-alert{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600}
.b-alert.over{background:var(--red-bg);color:var(--red)}
.b-alert.warn{background:var(--yel-bg);color:var(--yel)}
.b-alert.ok{background:var(--grn-bg);color:var(--grn)}

/* ── Tables (payments, subs) ── */
.pay-table{width:100%;border-collapse:collapse;font-size:11px}
.pay-table th{padding:6px 14px;text-align:left;font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--bdr);background:var(--surf3)}
.pay-table td{padding:7px 14px;border-bottom:1px solid var(--bdr)}
.pay-table tr:last-child td{border-bottom:none}
.pay-table td.amt{font-weight:600;text-align:right}
.pay-table td.amt.grn{color:var(--grn)}
.pay-table td.amt.red{color:var(--red)}
.pay-table td.muted{color:var(--tx3)}
.pay-table tr.total-row td{font-weight:700;background:var(--surf3)}
.pay-empty{padding:14px;text-align:center;font-size:11px;color:var(--tx3);font-style:italic}
.pay-add-form{padding:10px 14px;border-top:1px solid var(--bdr);display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:var(--surf2)}
.pay-add-form input{border:1px solid var(--bdr);border-radius:5px;padding:4px 7px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--surf);outline:none}
.pay-add-form input:focus{border-color:var(--blue)}
.btn-save-pay{padding:4px 10px;background:var(--blue);color:#fff;border:none;border-radius:5px;font-size:11px;font-family:inherit;font-weight:600;cursor:pointer}
.btn-save-pay:hover{background:#1d4ed8}
.btn-del-pay{background:none;border:none;cursor:pointer;font-size:11px;color:var(--tx3);padding:0 4px;opacity:.5}
.btn-del-pay:hover{opacity:1;color:var(--red)}

/* ── PF indicator ── */
.pf-ind{display:flex;align-items:center;gap:7px;padding:8px 14px;font-size:11px;font-weight:600}
.pf-ind.active{background:var(--red-bg);color:var(--red)}
.pf-ind.inactive{background:var(--surf3);color:var(--tx3)}
.gge-sub-row{display:flex;gap:5px;margin-top:5px}

/* ── PF sync bar ── */
.pf-sync-info{padding:7px 20px;background:#fef2f2;border-bottom:1px solid #fecaca;font-size:12px;color:#991b1b;display:none;align-items:center;gap:6px}
.pf-sync-info.visible{display:flex}

/* ── Modal ── */
.mf-lbl{display:block;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.mf-inp{width:100%;border:1px solid var(--bdr);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--tx);outline:none;transition:border .15s}
.mf-inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

[hidden]{display:none!important}
/* ── Scroll ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:99px}

/* ── Mobile ── */
@media(max-width:640px){
  .left-panel{width:100%;border-right:none;position:absolute;inset:0;z-index:2;transition:transform .2s}
  .left-panel.mob-hidden{transform:translateX(-100%)}
  .right-panel{width:100%}
  .hdr-tiles{display:none}
  .back-btn{display:flex!important}
  .sum-cell{padding:7px 8px}
  .sum-val{font-size:13px}
}
.back-btn{display:none;align-items:center;gap:5px;padding:5px 10px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div class="app">
<!-- Topbar -->
<div class="hdr">
  <div class="hdr-brand">ВПК · <span>Заказчики</span></div>
  <div class="hdr-tiles">
    <div class="tile"><div class="tile-val" id="t-total">0</div><div class="tile-lbl">Договоров</div></div>
    <div class="tile grn"><div class="tile-val" id="t-signed">0</div><div class="tile-lbl">Подписано</div></div>
    <div class="tile org"><div class="tile-val" id="t-sum">—</div><div class="tile-lbl">Сумма млн ₽</div></div>
    <div class="tile pur"><div class="tile-val" id="t-recv">—</div><div class="tile-lbl">Поступило млн ₽</div></div>
    <div class="tile red"><div class="tile-val" id="t-pf">0</div><div class="tile-lbl">→ Приоритет ПФ</div></div>
  </div>
</div>

<!-- PF bar -->
<div class="pf-sync-info" id="pf-bar">
  🔴 <strong id="pf-bar-names"></strong> — экспертиза пройдена, приоритет ПФ поднят автоматически
</div>

<!-- Split -->
<div class="split">
  <!-- LEFT -->
  <div class="left-panel" id="left-panel">
    <div class="left-head">
      <div class="search-row">
        <input class="fi-search" id="fsearch" placeholder="🔍  объект, № договора…" oninput="renderList()">
        <button class="btn-add" onclick="openAddModal()">＋ Договор</button>
      </div>
    </div>
    <div class="left-filters">
      <select class="fi-sm" id="fcust" onchange="renderList()">
        <option value="">Все заказчики</option>
        <option>ЕКС</option><option>Стройресурс</option>
        <option>ООО 495 ССУ</option><option>ООО «РСА»</option><option>Прочие</option>
      </select>
      <select class="fi-sm" id="fsign" onchange="renderList()">
        <option value="">Все статусы</option>
        <option value="подписан">Подписан</option>
        <option value="не подписан">Не подписан</option>
      </select>
      <select class="fi-sm" id="fgge" onchange="renderList()">
        <option value="">ГГЭ — все</option>
        <option value="пройдена">Пройдена</option>
        <option value="на рассмотрении">На рассмотрении</option>
      </select>
    </div>
    <div class="ctr-list" id="ctr-list"></div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel" id="right-panel">
    <div class="empty-state" id="empty-state">
      <div class="es-icon">📄</div>
      <p>Выберите договор из списка слева</p>
    </div>
    <div id="detail-view" hidden></div>
  </div>
</div>
</div>

<!-- Modal: add / edit -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--bdr)">
      <span id="modal-title" style="font-size:15px;font-weight:700;color:var(--tx)">Договор</span>
      <button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--tx3);line-height:1;padding:2px 6px">×</button>
    </div>
    <form id="modal-form" onsubmit="saveModal();return false;" style="padding:20px 22px;display:grid;gap:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label class="mf-lbl">Заказчик</label>
          <select name="cust" class="mf-inp" style="cursor:pointer" onchange="toggleCustName(this.value)">
            <option>ЕКС</option><option>Стройресурс</option>
            <option>ООО 495 ССУ</option><option>ООО «РСА»</option><option>Прочие</option>
          </select>
        </div>
        <div>
          <label class="mf-lbl">№ Договора</label>
          <input name="num" class="mf-inp" placeholder="напр. 123/24-ПИР">
        </div>
      </div>
      <div id="mf-custname-wrap" hidden>
        <label class="mf-lbl">Наименование заказчика (юр. лицо)</label>
        <input name="custname" class="mf-inp" placeholder="ООО «Ромашка»">
      </div>
      <div>
        <label class="mf-lbl">Сумма договора, ₽</label>
        <input name="sumval" type="number" class="mf-inp" placeholder="Необязательно — можно добавить при редактировании">
      </div>
      <div>
        <label class="mf-lbl">Объект</label>
        <input name="obj" class="mf-inp" placeholder="Наименование объекта">
      </div>
      <div>
        <label class="mf-lbl">Предмет договора</label>
        <input name="subj" class="mf-inp" placeholder="Разработка ПД, ИИ и т.д.">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div><label class="mf-lbl">Дата</label><input name="dt" class="mf-inp" placeholder="01.01.2024"></div>
        <div><label class="mf-lbl">Срок</label><input name="end" class="mf-inp" placeholder="31.12.2024"></div>
        <div>
          <label class="mf-lbl">Статус</label>
          <select name="sign" class="mf-inp" style="cursor:pointer">
            <option value="подписан">Подписан</option>
            <option value="не подписан">Не подписан</option>
          </select>
        </div>
      </div>
      <div><label class="mf-lbl">ТЗ</label><input name="tz" class="mf-inp" placeholder="Ссылка или номер ТЗ"></div>
      <div><label class="mf-lbl">Ссылка на папку</label><input name="link" class="mf-inp" placeholder="https://..."></div>

function allData(){
  return DATA.concat(customContracts).filter(function(d){return !deleted.has(d.id);}).map(function(d){
    var ev=edits[d.id]||{};
    return {
      id:d.id,num:ev.num!==undefined?ev.num:d.num,cust:ev.cust||d.cust,
      custname:ev.custname!==undefined?ev.custname:(d.custname||''),
      obj:ev.obj!==undefined?ev.obj:d.obj,subj:ev.subj!==undefined?ev.subj:d.subj,
      dt:ev.dt!==undefined?ev.dt:d.dt,end:ev.end!==undefined?ev.end:d.end,
      sign:ev.sign||d.sign,tz:ev.tz!==undefined?ev.tz:(d.tz||''),
      link:ev.link!==undefined?ev.link:(d.link||''),_custom:!!d._custom
    };
  });
}

function syncPF(){
  var pf={};
  allData().forEach(function(d){
    var ex=extra[d.id]||{};
    if(ex.pfname&&(ex.gge_status==='пройдена'||ex.exon_status==='одобрен')){pf[ex.pfname]='exp';}
  });
  try{localStorage.setItem(LS_PF,JSON.stringify(pf));}catch(e){}
  var names=Object.keys(pf);
  var bar=document.getElementById('pf-bar');
  if(bar){
    if(names.length){bar.classList.add('visible');document.getElementById('pf-bar-names').textContent=names.join(', ');}
    else bar.classList.remove('visible');
  }
  var t=document.getElementById('t-pf');
  if(t)t.textContent=names.length;
}

/* ============================================================
   Helpers
   ============================================================ */
function n(v){if(!v)return '—';return Math.round(v).toLocaleString('ru-RU')+' ₽';}
function nm(v){return v?+(v/1000000).toFixed(2):'0';}
function ea(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function pfActive(d){var ex=extra[d.id]||{};return ex.pfname&&(ex.gge_status==='пройдена'||ex.exon_status==='одобрен');}
function totalRecv(id){return getPays(id).reduce(function(s,p){return s+(parseFloat(p.amt)||0);},0);}
function parseDt(s){if(!s||s==='—')return null;var p=s.split('.');return new Date(+p[2],+p[1]-1,+p[0]);}
function endStr(s){
  if(!s||s==='—')return '<span class="no-date">—</span>';
  var d=parseDt(s);if(!d)return s;
  if(d<new Date())return '<span class="overdue" title="Срок истёк">'+s+' ⚠</span>';
  return s;
}
function tzBadge(v){
  if(v&&v.startsWith('http'))return '<a href="'+v+'" target="_blank" class="badge b-yes" style="text-decoration:none">✓ ссылка</a>';
  if(v==='да')return '<span class="badge b-yes">✓</span>';
  return '<span class="badge b-no">—</span>';
}
function statusBadge(s){
  if(s==='Подписан')return '<span class="badge b-grn">✓ '+s+'</span>';
  if(s==='Расторгнут')return '<span class="badge b-red">'+s+'</span>';
  return '<span class="badge b-gray">'+s+'</span>';
}

function updateTiles(){
  var ad=allData();
  var totalSum=ad.reduce(function(s,d){return s+(parseFloat(sums[d.id])||0);},0);
  var totalRecvAll=ad.reduce(function(s,d){return s+totalRecv(d.id);},0);
  document.getElementById('t-total').textContent=ad.length;
  document.getElementById('t-signed').textContent=ad.filter(function(d){return d.sign==='подписан';}).length;
  document.getElementById('t-sum').textContent=totalSum?nm(totalSum):'—';
  document.getElementById('t-recv').textContent=totalRecvAll?nm(totalRecvAll):'—';
}

      if(fGge&&ex.gge_status!==fGge)return false;
      if(q&&!(d.num.toLowerCase().includes(q)||d.obj.toLowerCase().includes(q)||d.subj.toLowerCase().includes(q)))return false;
      return true;
    });
    if(!items.length)return;
    html+='<div class="group-hd"><span>'+cust+'</span><span class="group-count">'+items.length+'</span></div>';
    items.forEach(function(d){
      var ex=extra[d.id]||{};
      var badges='';
      if(ex.gge_status==='пройдена')badges+='<span class="mini-badge mb-gge">ГГЭ ✓</span>';
      else if(ex.gge_status==='на рассмотрении')badges+='<span class="mini-badge mb-gge-pend">ГГЭ…</span>';
      if(ex.exon_status==='одобрен')badges+='<span class="mini-badge mb-exon">EXON ✓</span>';
      if(ex.ds==='да')badges+='<span class="mini-badge mb-ds">ДС</span>';
      if(pfActive(d))badges+='<span class="mini-badge mb-pf">→ПФ</span>';
      var sv=parseFloat(sums[d.id])||0;
      var rv=totalRecv(d.id);
      var sumLine=sv?'<div class="ci-sum">'+nm(sv)+' млн'+(rv?' · пост. '+nm(rv)+' млн':'')+'</div>':'';
      html+='<div class="ctr-item'+(selectedId===d.id?' active':'')+'" onclick="selectContract(\''+d.id+'\')">'+
        '<div class="sign-dot '+(d.sign==='подписан'?'yes':'no')+'"></div>'+
        '<div class="ci-body">'+
          '<div class="ci-num">'+d.num+'</div>'+
          '<div class="ci-obj">'+d.obj+'</div>'+
          '<div class="ci-sub">'+(d.cust==='Прочие'&&d.custname?'<strong>'+d.custname+'</strong> · ':'')+d.subj+(d.dt&&d.dt!=='—'?' · '+d.dt:'')+'</div>'+
          (badges?'<div class="ci-badges">'+badges+'</div>':'')+
          sumLine+
        '</div>'+
      '</div>';
    });
  });
  document.getElementById('ctr-list').innerHTML=html||'<div style="padding:20px;text-align:center;color:var(--tx3);font-size:12px">Ничего не найдено</div>';
}

function selectContract(id){
  selectedId=id;
  renderList();
  var d=allData().find(function(x){return x.id===id;});
  if(d)renderDetail(d);
  requestAnimationFrame(function(){document.getElementById('right-panel').scrollTop=0;});
  if(window.innerWidth<=640)document.getElementById('left-panel').classList.add('mob-hidden');
}

/* ============================================================
   RIGHT panel: detail
   ============================================================ */
function renderDetail(d){
  document.getElementById('empty-state').hidden=true;
  var dv=document.getElementById('detail-view');
  dv.hidden=false;
  var id=d.id;
  var ex=extra[id]||{};
  var dsYes=ex.ds==='да';
  var sv=parseFloat(sums[id])||0;
  var rv=totalRecv(id);
  var rem=sv-rv;
  var payPct=sv>0?Math.min(Math.round(rv/sv*100),100):0;

  /* --- HEADER --- */
  var html='<div class="detail-head">'+
    '<button class="back-btn" onclick="document.getElementById(\'left-panel\').classList.remove(\'mob-hidden\')">← Назад</button>'+
    '<div class="dh-main">'+
      '<div class="dh-num">'+d.num+'</div>'+
      '<div class="dh-meta"><span>'+(d.cust==='Прочие'&&d.custname?d.custname:d.cust)+'</span><span>·</span><span>'+d.obj+'</span>'+
        (d.sign==='подписан'?'<span>· <span style="color:#86efac">✓ Подписан</span></span>':'<span>· <span style="color:#fca5a5">⏳ Не подписан</span></span>')+
      '</div>'+
    '</div>'+
    '<div class="dh-actions">'+
      '<button class="dh-btn edit" onclick="openEditModal(\''+id+'\')">✏️ Редактировать</button>'+
      '<button class="dh-btn del" onclick="deleteContract(\''+id+'\',\''+ea(d.num)+'\')">🗑</button>'+
    '</div>'+
  '</div>';

  /* --- SUMMARY BAR --- */
  html+='<div class="sum-bar">'+
    '<div class="sum-cell"><div class="sum-val">'+(sv?nm(sv)+' млн':'<span style="color:var(--tx3);font-size:12px">не указана</span>')+'</div><div class="sum-lbl">Сумма договора</div></div>'+
    '<div class="sum-cell"><div class="sum-val grn">'+(rv?nm(rv)+' млн':'0')+'</div><div class="sum-lbl">Поступило</div></div>'+
    '<div class="sum-cell"><div class="sum-val '+(sv&&rem<0?'red':sv&&rem>0?'':'')+'">'+
      (sv?(rem>=0?nm(rem)+' млн':'-'+nm(Math.abs(rem))+' млн'):'—')+'</div><div class="sum-lbl">Остаток</div></div>'+
    '<div class="sum-cell"><div class="sum-val '+(payPct>=100?'grn':payPct>0?'':'')+'">'+
      (sv?payPct+'%':'—')+'</div><div class="sum-lbl">Оплачено</div></div>'+
  '</div>';

  /* --- PAYMENTS PROGRESS --- */
  if(sv>0){
    html+='<div class="prog-wrap">'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+payPct+'%;background:var(--grn)"></div></div>'+
      '<div class="prog-labels"><span>'+n(rv)+' поступило</span><span>из '+n(sv)+'</span></div>'+
    '</div>';
  }

  html+='<div class="sections">';

  /* --- BUDGET / SUBCONTRACTORS --- */
  var pfname=ex.pfname||'';
  var subs=pfname?(subsByPF[pfname]||[]):[];
  var subTotal=subs.reduce(function(s,c){return s+(c.amount||0);},0);
  var budPct=sv>0?Math.round(subTotal/sv*100):0;
  var budCls=budPct>100?'over':budPct>85?'warn':'ok';
  html+='<div class="card"><div class="card-hd"><span>🏗 Подрядчики / Бюджет</span></div>';
  if(sv>0){
    var alertMsg=budPct>100
      ?'⚠️ Превышение! Подряд больше суммы договора на '+n(subTotal-sv)
      :budPct>85
        ?'⚠️ Использовано '+budPct+'% — осталось '+n(sv-subTotal)
        :'✓ В бюджете — маржа '+n(sv-subTotal)+' ('+(100-budPct)+'%)';
    html+='<div class="budget-block">'+
      '<div class="b-track-row">'+
        '<span style="font-size:10px;font-weight:600;color:var(--tx3);width:80px">Подряд/Договор</span>'+
        '<div class="b-track"><div class="b-fill '+budCls+'" style="width:'+Math.min(budPct,100)+'%"></div></div>'+
        '<span class="b-pct '+budCls+'">'+budPct+'%</span>'+
      '</div>'+
      '<div class="b-nums"><span>'+n(subTotal)+' подряд</span><span>из</span><span>'+n(sv)+' договор</span></div>'+
      '<div class="b-alert '+budCls+'">'+alertMsg+'</div>'+
    '</div>';
  } else {
    html+='<div class="budget-block"><div style="font-size:11px;color:var(--tx3)">Укажите сумму договора выше для контроля бюджета</div></div>';
  }
  if(subs.length){
    html+='<table class="pay-table"><thead><tr><th>Подрядчик</th><th>Предмет</th><th>Статус</th><th style="text-align:right">Сумма</th></tr></thead><tbody>';
    var subsTotal=0;
    subs.forEach(function(c){
      subsTotal+=c.amount||0;
      html+='<tr>'+
        '<td>'+c.contractor+'</td>'+
        '<td class="muted">'+c.subj+'</td>'+
        '<td>'+statusBadge(c.sign_status)+'</td>'+
        '<td class="amt">'+n(c.amount)+'</td>'+
      '</tr>';
    });
    html+='<tr class="total-row"><td colspan="3"><span style="color:var(--tx2)">Итого по подряду</span></td>'+
      '<td class="amt '+(budPct>100?'red':budPct>85?'':'grn')+'">'+n(subsTotal)+'</td></tr>';
    html+='</tbody></table>';
  } else {
    html+='<div class="pay-empty">'+(pfname?'Подрядные договоры по объекту «'+pfname+'» не найдены в реестре':'Выберите объект в поле «Связь с ПФ» для отображения подрядчиков')+'</div>';
  }
  html+='</div>';

  /* --- PAYMENTS --- */
  var pays=getPays(id);
  html+='<div class="card"><div class="card-hd"><span>💰 Поступления</span><button class="card-hd-btn" onclick="openPayModal(\''+id+'\')">＋ Добавить</button></div>';
  if(pays.length){
    var pTotal=0;
    html+='<table class="pay-table"><thead><tr><th>Дата</th><th>Назначение</th><th style="text-align:right">Сумма</th><th></th></tr></thead><tbody>';
    pays.forEach(function(p,i){
      pTotal+=parseFloat(p.amt)||0;
      html+='<tr>'+
        '<td class="muted">'+p.dt+'</td>'+
        '<td>'+p.note+'</td>'+
        '<td class="amt grn">'+n(p.amt)+'</td>'+
        '<td><button class="btn-del-pay" onclick="delPay(\''+id+'\','+i+')">✕</button></td>'+
      '</tr>';
    });
    html+='<tr class="total-row"><td colspan="2">Итого поступило</td><td class="amt grn">'+n(pTotal)+'</td><td></td></tr>';
    html+='</tbody></table>';
  } else {
    html+='<div class="pay-empty">Платежей нет — нажмите «＋ Добавить»</div>';
  }
  html+='</div>';

  /* --- ОСНОВНОЕ --- */
  html+='<div class="card"><div class="card-hd">📋 Основное</div>'+
    fld('Сумма, ₽',sv?'<span style="font-weight:600;color:var(--blue)">'+n(sv)+'</span>':'<span class="no-date">не указана</span>',false)+
    fld('ДС к договору','<button class="badge b-btn '+(dsYes?'b-yes':'b-no')+'" onclick="toggleBadge(\''+id+'\',\'ds\',this)">'+(dsYes?'✓ есть':'—')+'</button>',false)+
    (d.cust==='Прочие'?fld('Заказчик',d.custname||'<span class="no-date">не указано — редактировать</span>',false):'')+
    fld('Предмет',d.subj||'<span class="no-date">—</span>',false)+
    fld('Дата',d.dt&&d.dt!=='—'?d.dt:'<span class="no-date">не указана</span>',false)+
    fld('Срок',endStr(d.end),false)+
    fld('Подписан',d.sign==='подписан'?'<span class="badge b-signed">✓ Подписан</span>':'<span class="badge b-nosign">✗ Не подписан</span>',false)+
    fld('ТЗ',tzBadge(d.tz),false)+
    fld('Папка',d.link?'<a href="'+d.link+'" target="_blank" class="ext-link">🔗 Открыть на Яндекс.Диске</a>':'<span class="no-date">—</span>',true)+
  '</div>';

  /* --- ЭКСПЕРТИЗА --- */
  var ggeStatus=ex.gge_status||'';
  var exonStatus=ex.exon_status||'';
  html+='<div class="card"><div class="card-hd">🏛 Экспертиза</div>'+
    fld('Статус ГГЭ',
      '<select class="sel-sm" onchange="onExtraChange(\''+id+'\',\'gge_status\',this.value)">'+
        '<option value=""'+(ggeStatus===''?' selected':'')+'>—</option>'+
        '<option value="на рассмотрении"'+(ggeStatus==='на рассмотрении'?' selected':'')+'>⏳ На рассмотрении</option>'+
        '<option value="пройдена"'+(ggeStatus==='пройдена'?' selected':'')+'>✓ Пройдена</option>'+
      '</select>'+
      '<div class="gge-sub-row" style="display:'+(ggeStatus==='пройдена'?'flex':'none')+'" id="gge-sub-'+id+'">'+
        '<input class="inp-sm'+(ex.gge_num?' filled':'')+'" placeholder="№ заключения" value="'+(ex.gge_num||'')+'" onblur="onExtraBlur(\''+id+'\',\'gge_num\',this)" title="Номер заключения ГГЭ">'+
        '<input class="inp-sm'+(ex.gge_date?' filled':'')+'" placeholder="Дата" value="'+(ex.gge_date||'')+'" onblur="onExtraBlur(\''+id+'\',\'gge_date\',this)" title="Дата заключения ГГЭ">'+
      '</div>',false)+
    fld('Статус EXON',
      '<select class="sel-sm" onchange="onExtraChange(\''+id+'\',\'exon_status\',this.value)">'+
        '<option value=""'+(exonStatus===''?' selected':'')+'>—</option>'+
        '<option value="в работе"'+(exonStatus==='в работе'?' selected':'')+'>⏳ В работе</option>'+
        '<option value="одобрен"'+(exonStatus==='одобрен'?' selected':'')+'>✓ Одобрен</option>'+
        '<option value="отклонён"'+(exonStatus==='отклонён'?' selected':'')+'>✗ Отклонён</option>'+
      '</select>',true)+
  '</div>';

  /* --- ЗАКРЫВАЮЩИЕ --- */
  var clType=ex.closetype||'';
  var clStatus=ex.closestatus||'';
  html+='<div class="card"><div class="card-hd">📑 Закрывающие документы</div>'+
    fld('Тип',
      '<select class="sel-sm" onchange="onExtraChange(\''+id+'\',\'closetype\',this.value)">'+
        '<option value=""'+(clType===''?' selected':'')+'>—</option>'+
        '<option value="Акт"'+(clType==='Акт'?' selected':'')+'>Акт</option>'+
        '<option value="КС-2/КС-3"'+(clType==='КС-2/КС-3'?' selected':'')+'>КС-2/КС-3</option>'+
      '</select>',false)+
    (clType?fld('Статус',
      '<select class="sel-sm" onchange="onExtraChange(\''+id+'\',\'closestatus\',this.value)">'+
        '<option value=""'+(clStatus===''?' selected':'')+'>—</option>'+
        '<option value="в работе"'+(clStatus==='в работе'?' selected':'')+'>В работе</option>'+
        '<option value="подписан"'+(clStatus==='подписан'?' selected':'')+'>✓ Подписан</option>'+
        '<option value="замечания"'+(clStatus==='замечания'?' selected':'')+'>! Замечания</option>'+
      '</select>',true):'')+
  '</div>';

  /* --- СВЯЗЬ С ПФ --- */
  var pfInd='';
  if(pfActive(d)){pfInd='<div class="pf-ind active">🔴 Экспертиза пройдена — первоочередная оплата в Плане-Факте</div>';}
  else if(pfname){pfInd='<div class="pf-ind inactive">Связан с «'+pfname+'» — экспертиза ещё не пройдена</div>';}
  html+='<div class="card"><div class="card-hd">📊 Связь с Планом-Фактом</div>'+
    fld('Объект в ПФ',
      '<select class="sel-sm" style="width:200px" onchange="onExtraChange(\''+id+'\',\'pfname\',this.value)">'+
        '<option value="">— выберите объект —</option>'+
        PF_OBJECTS.map(function(o){return '<option value="'+o+'"'+(pfname===o?' selected':'')+'>'+o+'</option>';}).join('')+
      '</select>',true)+
  pfInd+'</div>';

  /* --- КОММЕНТАРИЙ --- */
  html+='<div class="card"><div class="card-hd">💬 Комментарий</div>'+
    '<textarea class="cmt-area" placeholder="Заметки по договору…" onblur="onExtraBlur(\''+id+'\',\'comment\',this)">'+(ex.comment||'')+'</textarea>'+
  '</div>';

  html+='</div>'; // /sections
  dv.innerHTML=html;
}

function fld(lbl,val,last){
  return '<div class="field'+(last?' style=\"border-bottom:none\"':'')+'">'+
    '<div class="field-lbl">'+lbl+'</div><div class="field-val">'+val+'</div></div>';
}

/* ============================================================
   Inline field handlers
   ============================================================ */
function onSumInput(id,inp){
  var v=inp.value;
  if(v)sums[id]=parseFloat(v);else delete sums[id];
  saveSums();
  inp.classList.toggle('has-val',!!v);
  updateTiles();
  renderList();
  // Re-render to refresh budget/payment bars without losing focus
  setTimeout(function(){
    var d=allData().find(function(x){return x.id===id;});
    if(d&&selectedId===id)renderDetail(d);
  },600);
}

function onExtraBlur(id,field,inp){
  getEx(id)[field]=inp.value;saveExtra();
  if(field==='pfname'){syncPF();if(selectedId===id){var d=allData().find(function(x){return x.id===id;});if(d)renderDetail(d);}}
}

function onExtraChange(id,field,val){
  getEx(id)[field]=val;saveExtra();syncPF();
  if(field==='gge_status'){
    var sub=document.getElementById('gge-sub-'+id);
    if(sub)sub.style.display=val==='пройдена'?'flex':'none';
  }
  renderList();
  if(selectedId===id){var d=allData().find(function(x){return x.id===id;});if(d)renderDetail(d);}
}

function toggleBadge(id,field,btn){
  var ex=getEx(id);
  ex[field]=(ex[field]==='да'?'нет':'да');
  saveExtra();
  var yes=ex[field]==='да';
  btn.className='badge b-btn '+(yes?'b-yes':'b-no');
  btn.textContent=yes?'✓ есть':'—';
  renderList();
}

/* ============================================================
   Payments
   ============================================================ */
var payModalId=null;
function openPayModal(id){payModalId=id;var f=document.getElementById('pay-form');f.reset();document.getElementById('pay-modal').style.display='flex';}
function closePay(){document.getElementById('pay-modal').style.display='none';}
function savePay(){
  var f=document.getElementById('pay-form');
  var dt=f.querySelector('[name=pdt]').value.trim();
  var amt=parseFloat(f.querySelector('[name=pamt]').value)||0;
  var note=f.querySelector('[name=pnote]').value.trim();
  if(!dt||!amt){return;}
  if(!payments[payModalId])payments[payModalId]=[];
  payments[payModalId].push({dt:dt,amt:amt,note:note||'Оплата'});
  savePays();closePay();updateTiles();renderList();
  var d=allData().find(function(x){return x.id===payModalId;});
  if(d)renderDetail(d);
}
function delPay(id,idx){
  if(!payments[id])return;
  payments[id].splice(idx,1);
  savePays();updateTiles();renderList();
  var d=allData().find(function(x){return x.id===id;});
  if(d)renderDetail(d);
}

/* ============================================================
   Delete
   ============================================================ */
function deleteContract(id,name){
  if(!confirm('Удалить «'+name+'»?\n\nДоговор будет скрыт из реестра.'))return;
  deleted.add(id);saveDeleted();
  if(selectedId===id){
    selectedId=null;
    document.getElementById('empty-state').hidden=false;
    document.getElementById('detail-view').hidden=true;
    document.getElementById('empty-state').innerHTML='<div class="es-icon">📄</div><p>Выберите договор из списка слева</p>';
  }
  renderList();updateTiles();syncPF();
}

/* ============================================================
   Add / Edit modal
   ============================================================ */
var modalId=null;
function openAddModal(){modalId=null;_fillModal(null);document.getElementById('modal-title').textContent='Новый договор';document.getElementById('modal-overlay').style.display='flex';}
function openEditModal(id){modalId=id;var d=allData().find(function(x){return x.id===id;});if(!d)return;_fillModal(d);document.getElementById('modal-title').textContent='Редактировать договор';document.getElementById('modal-overlay').style.display='flex';}
function toggleCustName(val){
  document.getElementById('mf-custname-wrap').hidden=(val!=='Прочие');
}
function _fillModal(d){
  var f=document.getElementById('modal-form');
  var custVal=d?d.cust:'ЕКС';
  f.querySelector('[name=cust]').value=custVal;
  f.querySelector('[name=num]').value=d?d.num:'';
  f.querySelector('[name=obj]').value=d?d.obj:'';
  f.querySelector('[name=subj]').value=d?d.subj:'';
  f.querySelector('[name=dt]').value=d?d.dt:'';
  f.querySelector('[name=end]').value=d?d.end:'';
  f.querySelector('[name=sign]').value=d?(d.sign||'не подписан'):'не подписан';
  f.querySelector('[name=tz]').value=d?d.tz:'';
  f.querySelector('[name=link]').value=d?d.link:'';
  f.querySelector('[name=custname]').value=d?(d.custname||''):'';
  f.querySelector('[name=sumval]').value=d?(sums[d.id]||''):'';
  toggleCustName(custVal);
}
function closeModal(){document.getElementById('modal-overlay').style.display='none';}
function saveModal(){
  var f=document.getElementById('modal-form');
  var data={num:f.querySelector('[name=num]').value.trim(),cust:f.querySelector('[name=cust]').value,custname:f.querySelector('[name=custname]').value.trim(),obj:f.querySelector('[name=obj]').value.trim(),subj:f.querySelector('[name=subj]').value.trim(),dt:f.querySelector('[name=dt]').value.trim(),end:f.querySelector('[name=end]').value.trim(),sign:f.querySelector('[name=sign]').value,tz:f.querySelector('[name=tz]').value.trim(),link:f.querySelector('[name=link]').value.trim()};
  var sv=parseFloat(f.querySelector('[name=sumval]').value)||0;
  if(!data.num&&!data.obj){alert('Заполните хотя бы № договора или объект.');return;}
  var targetId;
  if(modalId){edits[modalId]=data;saveEdits();targetId=modalId;}
  else{var newId='c'+Date.now();customContracts.push(Object.assign({id:newId,_custom:true},data));saveCustom();targetId=newId;}
  if(sv){sums[targetId]=sv;saveSums();}
  closeModal();renderList();updateTiles();syncPF();
  if(modalId&&selectedId===modalId){var d=allData().find(function(x){return x.id===modalId;});if(d)renderDetail(d);}
}

/* ============================================================
   Init
   ============================================================ */
syncPF();
updateTiles();
renderList();
loadSubContracts();
</script>
