<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд ВПК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<!--
  Дашборд компании для большого экрана (ТВ 16:9, Full HD или 4K — всё масштабируется от ширины).
  ТОЛЬКО ЧТЕНИЕ: страница делает лишь GET-запросы к Supabase (storage): реестр договоров и Трекер КП.
  Параметры адреса:
    ?mode=office   — общий офисный экран: без слайда и плиток с расчётами с исполнителями
    ?slide=N       — открыть и зафиксировать слайд N (1..3), без автопрокрутки
    ?sec=30        — секунд на слайд (по умолчанию 25)
    ?test=popup    — показать пример всплывающего события
    ?test=trends   — нарисовать тренды на выдуманной истории (пока снимков нет)
  Клавиши: ← → — листать, пробел — пауза, F — полный экран.
-->
<style>
:root{
  --bg:#0B1220; --bg2:#101A2E; --card:#14213A; --card2:#18284A; --line:#22345A;
  --ink:#F3F6FC; --ink2:#B7C3DA; --muted:#7D8BA8;
  --accent:#3E63DD; --accent2:#6F8EF0; --accentSoft:rgba(62,99,221,.18);
  --good:#2FB67C; --warn:#E7A93B; --bad:#E5534B;
  --goodSoft:rgba(47,182,124,.16); --warnSoft:rgba(231,169,59,.16); --badSoft:rgba(229,83,75,.16);
  --u:calc(100vw / 1920); /* 1 «пиксель» макета 1920×1080 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,Segoe UI,Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 90% at 0% 0%,#1A2B55 0%,var(--bg) 55%) fixed;cursor:none}
body.mouse{cursor:default}
.num{font-variant-numeric:tabular-nums}

/* --- шапка --- */
header{position:fixed;left:0;right:0;top:0;height:calc(96*var(--u));display:flex;align-items:center;gap:calc(22*var(--u));padding:0 calc(56*var(--u));}
.logo{display:flex;align-items:center;gap:calc(14*var(--u))}
.logo svg{width:calc(40*var(--u));height:calc(44*var(--u))}
.logo b{font-size:calc(34*var(--u));font-weight:700;letter-spacing:.04em}
.logo span{font-size:calc(11*var(--u));line-height:1.15;color:var(--ink2);letter-spacing:.22em;font-weight:300}
.htitle{margin-left:calc(26*var(--u));padding-left:calc(26*var(--u));border-left:1px solid var(--line);font-size:calc(30*var(--u));font-weight:500}
.hright{margin-left:auto;display:flex;align-items:center;gap:calc(30*var(--u));color:var(--ink2);font-size:calc(22*var(--u))}
.clock{font-size:calc(40*var(--u));font-weight:500;color:var(--ink)}
.conn{display:flex;align-items:center;gap:calc(8*var(--u))}
.dot{width:calc(12*var(--u));height:calc(12*var(--u));border-radius:50%;background:var(--good)}
.conn.err .dot{background:var(--bad)}

/* --- слайды --- */
main{position:fixed;left:calc(56*var(--u));right:calc(56*var(--u));top:calc(104*var(--u));bottom:calc(84*var(--u))}
.slide{position:absolute;inset:0;opacity:0;transform:translateY(calc(12*var(--u)));transition:opacity .7s,transform .7s;pointer-events:none;display:flex;flex-direction:column;gap:calc(22*var(--u))}
.slide.on{opacity:1;transform:none}
.grid{display:grid;gap:calc(22*var(--u));min-height:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:calc(18*var(--u));padding:calc(26*var(--u)) calc(30*var(--u));min-height:0;overflow:hidden;display:flex;flex-direction:column}
.card h3{font-size:calc(22*var(--u));font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:calc(16*var(--u));display:flex;align-items:baseline;gap:calc(12*var(--u))}
.card h3 small{font-size:calc(18*var(--u));text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;margin-left:auto}

/* плитки */
.tile .big{font-size:calc(84*var(--u));font-weight:700;line-height:1;letter-spacing:-.01em}
.tile .big .u{font-size:calc(38*var(--u));font-weight:400;color:var(--ink2);margin-left:calc(8*var(--u))}
.tile .lbl{font-size:calc(26*var(--u));color:var(--ink2);margin-top:calc(14*var(--u))}
.tile .sub{font-size:calc(21*var(--u));color:var(--muted);margin-top:auto;padding-top:calc(14*var(--u))}
.tile.bad{border-color:rgba(229,83,75,.55);background:linear-gradient(180deg,rgba(229,83,75,.20),var(--card))}
.tile.warn{border-color:rgba(231,169,59,.5)}
.tile.acc{border-color:rgba(62,99,221,.6);background:linear-gradient(180deg,rgba(62,99,221,.28),var(--card))}

/* бары */
.bars{display:flex;flex-direction:column;gap:calc(14*var(--u));flex:1;justify-content:center}
.bar{display:grid;grid-template-columns:calc(330*var(--u)) 1fr calc(200*var(--u));align-items:center;gap:calc(18*var(--u));font-size:calc(24*var(--u))}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bar .t{height:calc(30*var(--u));background:rgba(255,255,255,.04);border-radius:calc(4*var(--u));position:relative}
.bar .f{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 calc(4*var(--u)) calc(4*var(--u)) 0;min-width:calc(3*var(--u))}
.bar .f.o{background:var(--bad)}
.bar .v{text-align:right;color:var(--ink);font-weight:500}
.bar .v i{font-style:normal;color:var(--muted);font-weight:400;font-size:calc(19*var(--u));display:block}

/* столбцы по неделям */
.cols{flex:1;display:flex;align-items:flex-end;gap:calc(10*var(--u));padding-top:calc(40*var(--u));border-bottom:1px solid var(--line);min-height:0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .c{width:72%;background:var(--accent);border-radius:calc(4*var(--u)) calc(4*var(--u)) 0 0;min-height:calc(3*var(--u))}
.col.o .c{background:var(--bad)} .col.now .c{background:var(--warn)}
.col .v{font-size:calc(19*var(--u));color:var(--ink);font-weight:500;margin-bottom:calc(6*var(--u));white-space:nowrap}
.wl{display:flex;gap:calc(10*var(--u))}
.wl div{flex:1;text-align:center;font-size:calc(19*var(--u));color:var(--ink2);padding-top:calc(8*var(--u));white-space:nowrap}
.wl div.now{color:var(--warn);font-weight:700}
.lg{display:inline-flex;align-items:center;gap:calc(6*var(--u));margin-left:calc(16*var(--u))}
.lg i{display:inline-block;width:calc(14*var(--u));height:calc(14*var(--u));border-radius:calc(3*var(--u))}

/* тренды на плитках */
.tile{position:relative}
.trend{position:absolute;right:calc(26*var(--u));top:calc(24*var(--u));display:flex;flex-direction:column;align-items:flex-end;gap:calc(6*var(--u))}
.trend svg{width:calc(170*var(--u));height:calc(46*var(--u));overflow:visible}
.trend .d{font-size:calc(19*var(--u));font-weight:500;white-space:nowrap;color:var(--ink2)}
.trend .d.good{color:#6FDCA8} .trend .d.bad{color:#FF8F87}

/* карточки объектов */
.ocards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:calc(22*var(--u));flex:1;min-height:0}
.oc h4{font-size:calc(30*var(--u));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .meta{font-size:calc(19*var(--u));color:var(--muted);margin-top:calc(4*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .pb{height:calc(14*var(--u));background:rgba(255,255,255,.06);border-radius:99px;margin:calc(18*var(--u)) 0 calc(6*var(--u));overflow:hidden;display:flex}
.oc .pb i{display:block;height:100%;background:var(--good)}
.oc .pbl{display:flex;justify-content:space-between;font-size:calc(19*var(--u));color:var(--ink2)}
.oc .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(10*var(--u));margin-top:auto;padding-top:calc(14*var(--u))}
.oc .nums b{display:block;font-size:calc(36*var(--u));font-weight:700;line-height:1.05}
.oc .nums span{font-size:calc(17*var(--u));color:var(--muted)}
.oc .nums .o b{color:#FF8F87}
.oc .flags{display:flex;gap:calc(8*var(--u));flex-wrap:wrap;margin-top:calc(12*var(--u));min-height:calc(32*var(--u))}
.pager{font-size:calc(19*var(--u));color:var(--muted)}

/* менеджеры */
table.mg{width:100%;border-collapse:separate;border-spacing:0 calc(14*var(--u));font-size:calc(30*var(--u))}
table.mg th{color:var(--muted);font-weight:400;font-size:calc(18*var(--u));text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:0 calc(16*var(--u));white-space:nowrap}
table.mg th:first-child,table.mg th.l{text-align:left}
table.mg td{background:rgba(255,255,255,.035);padding:calc(26*var(--u)) calc(18*var(--u));text-align:right;white-space:nowrap}
table.mg td:first-child{text-align:left;border-radius:calc(10*var(--u)) 0 0 calc(10*var(--u));font-weight:500}
table.mg td:last-child{border-radius:0 calc(10*var(--u)) calc(10*var(--u)) 0}
table.mg td.l{text-align:left}
table.mg td.z{color:var(--muted)}
.stk{display:flex;height:calc(22*var(--u));border-radius:calc(4*var(--u));overflow:hidden;gap:calc(2*var(--u));min-width:calc(260*var(--u))}
.stk i{display:block;height:100%}

/* всплывающее событие */
#pop{position:fixed;left:50%;bottom:calc(110*var(--u));transform:translate(-50%,calc(40*var(--u)));opacity:0;transition:opacity .5s,transform .5s;z-index:20;pointer-events:none;
  min-width:calc(1000*var(--u));max-width:calc(1500*var(--u));background:linear-gradient(135deg,#2A47B8,#1A2B55);border:2px solid var(--accent2);border-radius:calc(24*var(--u));
  padding:calc(30*var(--u)) calc(44*var(--u));box-shadow:0 calc(30*var(--u)) calc(90*var(--u)) rgba(0,0,0,.6);display:flex;gap:calc(30*var(--u));align-items:center}
#pop.on{opacity:1;transform:translate(-50%,0)}
#pop .ic{font-size:calc(80*var(--u));line-height:1}
#pop .k{font-size:calc(22*var(--u));color:#C9D6FF;text-transform:uppercase;letter-spacing:.1em}
#pop .h{font-size:calc(46*var(--u));font-weight:700;line-height:1.15;margin-top:calc(6*var(--u))}
#pop .s{font-size:calc(26*var(--u));color:#DCE4FF;margin-top:calc(8*var(--u))}
#pop.good{background:linear-gradient(135deg,#1E7A55,#123A2D);border-color:#6FDCA8}

/* списки */
.list{display:flex;flex-direction:column;gap:calc(10*var(--u));overflow:hidden}
.row{display:flex;align-items:center;gap:calc(16*var(--u));font-size:calc(23*var(--u));padding:calc(12*var(--u)) calc(16*var(--u));background:rgba(255,255,255,.035);border-radius:calc(10*var(--u));border-left:calc(5*var(--u)) solid var(--line)}
.row.bad{border-left-color:var(--bad)} .row.warn{border-left-color:var(--warn)} .row.good{border-left-color:var(--good)} .row.acc{border-left-color:var(--accent)}
.row .m{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{color:var(--muted);font-size:calc(19*var(--u));margin-left:calc(10*var(--u))}
.row .r{white-space:nowrap;color:var(--ink2);font-size:calc(21*var(--u))}
.empty{color:var(--muted);font-size:calc(23*var(--u));padding:calc(10*var(--u)) 0}

.pill{display:inline-flex;align-items:center;gap:calc(8*var(--u));padding:calc(5*var(--u)) calc(14*var(--u));border-radius:99px;font-size:calc(19*var(--u));font-weight:500;white-space:nowrap}
.pill.bad{background:var(--badSoft);color:#FF8F87} .pill.warn{background:var(--warnSoft);color:#F5C66E} .pill.good{background:var(--goodSoft);color:#6FDCA8} .pill.acc{background:var(--accentSoft);color:#A9BDFB} .pill.mut{background:rgba(255,255,255,.06);color:var(--ink2)}

/* воронка */
.funnel{display:flex;flex-direction:column;gap:calc(14*var(--u));flex:1;justify-content:space-evenly}
.fst{display:grid;grid-template-columns:calc(250*var(--u)) 1fr;align-items:center;gap:calc(18*var(--u))}
.fst .n{font-size:calc(24*var(--u));color:var(--ink2)}
.fst .t{height:calc(58*var(--u));position:relative}
.fst .f{position:absolute;left:0;top:0;bottom:0;border-radius:calc(4*var(--u));background:var(--accent);display:flex;align-items:center;padding-left:calc(16*var(--u));font-size:calc(28*var(--u));font-weight:700;min-width:calc(64*var(--u))}
.fst .f.g{background:#2F4FB5} .fst .f.x{background:#3A4660}
.fst .s{position:absolute;top:50%;transform:translateY(-50%);font-size:calc(22*var(--u));color:var(--ink2);white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:calc(12*var(--u))}
.kv{display:flex;flex-direction:column;gap:calc(4*var(--u));padding:calc(14*var(--u)) calc(20*var(--u));background:rgba(255,255,255,.04);border-radius:calc(12*var(--u));min-width:calc(150*var(--u))}
.kv b{font-size:calc(46*var(--u));font-weight:700;line-height:1}
.kv span{font-size:calc(19*var(--u));color:var(--ink2)}

.note{font-size:calc(19*var(--u));color:var(--muted);display:flex;gap:calc(10*var(--u));align-items:flex-start;margin-top:auto;padding-top:calc(12*var(--u))}
.note.w{color:#F5C66E}

table.t{width:100%;border-collapse:collapse;font-size:calc(23*var(--u))}
table.t th{color:var(--muted);font-weight:400;text-align:left;font-size:calc(18*var(--u));text-transform:uppercase;letter-spacing:.06em;padding:0 calc(10*var(--u)) calc(10*var(--u))}
table.t td{padding:calc(11*var(--u)) calc(10*var(--u));border-top:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}

/* лента событий */
.feed .row{font-size:calc(21*var(--u));padding:calc(9*var(--u)) calc(14*var(--u))}

/* --- подвал --- */
footer{position:fixed;left:calc(56*var(--u));right:calc(56*var(--u));bottom:calc(22*var(--u));height:calc(46*var(--u));display:flex;align-items:center;gap:calc(26*var(--u));font-size:calc(19*var(--u));color:var(--muted)}
.tabs{display:flex;gap:calc(10*var(--u))}
.tab{white-space:nowrap;padding:calc(7*var(--u)) calc(16*var(--u));border-radius:99px;background:rgba(255,255,255,.04);position:relative;overflow:hidden;color:var(--ink2)}
.tab.on{background:var(--accentSoft);color:var(--ink)}
.tab .p{position:absolute;left:0;bottom:0;height:calc(3*var(--u));background:var(--accent2);width:0}
.fright{margin-left:auto;display:flex;gap:calc(22*var(--u));align-items:center}
.paused{color:var(--warn)}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(30*var(--u));color:var(--ink2)}
</style>
</head>
<body>
<header>
  <div class="logo" aria-label="ВПК Прогресс Энерго">
    <svg viewBox="0 0 215 235" aria-hidden="true"><mask id="cut"><polygon points="0,0 122,0 215,235 0,235" fill="#fff"/><g stroke="#000" stroke-width="9"><line x1="20" y1="-4" x2="168" y2="110"/><line x1="72" y1="-4" x2="-4" y2="118"/><line x1="-4" y1="196" x2="190" y2="164"/></g></mask><rect width="215" height="235" fill="#fff" mask="url(#cut)"/></svg>
    <b>ВПК</b><span>ПРОГРЕСС<br>ЭНЕРГО</span>
  </div>
  <div class="htitle" id="htitle">Компания сегодня</div>
  <div class="hright">
    <div class="conn" id="conn"><div class="dot"></div><span id="connTxt">загрузка…</span></div>
    <div id="date"></div>
    <div class="clock num" id="clock"></div>
  </div>
</header>
<main id="main"></main>
<div id="boot">Загружаю данные…</div>
<div id="pop"></div>
<footer>
  <div class="tabs" id="tabs"></div>
  <div class="fright"><span id="pause"></span><span id="upd"></span></div>
</footer>

<script>
(function(){
'use strict';
/* ================= настройки ================= */
var SUPA='https://urfnpjumxkewyizaxgns.supabase.co/rest/v1/storage';
var SNAP='https://urfnpjumxkewyizaxgns.supabase.co/rest/v1/dash_snapshots'; // ежедневные снимки (Бэкап проекта/Дашборд — снимки для трендов/setup.sql)
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZm5wanVteGtld3lpemF4Z25zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMzkyNDMsImV4cCI6MjA5MTgxNTI0M30.vDbdyE3Z4whApQo50Mfgor11SL-dT1PWDOygipxVKtE';
var Q=new URLSearchParams(location.search);
var OFFICE=Q.get('mode')==='office';
var SEC=Math.max(8,+Q.get('sec')||25);
var FIXED=+Q.get('slide')||0;
var REFRESH_MS=60000;              // данные — раз в минуту
var RELOAD_MS=6*3600*1000;         // страница целиком — раз в 6 часов (подхватить новую версию)

var STAGE={new:'Новые',subdivisions:'В расчёте',returned:'Возврат в КО',decision:'Решение ПО',accepted:'Принято в работу',rejected:'Отказ'};
var STAGE_ORDER=['new','subdivisions','returned','decision','accepted','rejected'];
var STAGE_SLA_DAYS={new:2,subdivisions:7,decision:2,accepted:5,returned:3}; // как в Трекере КП
var STAGE_CHANGE_RE=/Заявка создана|Возврат в коммерческий|отправлена повторно|Первичный контроль|завершили оценку|Досрочный переход|Возврат на переработку|вернул заявку в производств|Решение:/;
var PROS={contact:'Первый контакт',preparing_kp:'Готовим КП',kp:'Готовим КП',negotiation:'Переговоры',won:'Стал заказчиком',lost:'Отказ'};
var EXCLUDED={'Расторжение':1,'Договор аннулирован из-за смены ИП':1,'Договор аннулирован, из-за смены ИП':1};

/* ================= утилиты ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;var s=String(v).replace(/[^\d,.\-]/g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n;}
function mln(v,d){return (v/1e6).toLocaleString('ru-RU',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d});}
function money(v){return v>=1e6?mln(v)+' млн':v>=1e3?Math.round(v/1e3).toLocaleString('ru-RU')+' тыс':Math.round(v).toLocaleString('ru-RU');}
function parseDate(s){
  if(!s)return null;s=String(s).trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m)return new Date(m[3].length===2?2000+ +m[3]:+m[3],m[2]-1,+m[1]);
  return null;
}
function day0(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function daysFrom(d){return Math.round((day0(d)-day0(new Date()))/864e5);}
function fd(d){return d?d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):'';}
function fdy(d){return d?d.toLocaleDateString('ru-RU'):'';}
function plural(n,a,b,c){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);var y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y0)/864e5+1)/7);}
function yes(v){return /^(да|yes|true|1)$/i.test(String(v||'').trim());}
function relDays(n){if(n===0)return 'сегодня';if(n===1)return 'завтра';if(n===-1)return 'вчера';return n<0?(-n)+' '+plural(-n,'день','дня','дней')+' назад':'через '+n+' '+plural(n,'день','дня','дней');}

/* ================= загрузка (только GET) ================= */
var HDR={apikey:KEY,Authorization:'Bearer '+KEY};
function get(q){return fetch(SUPA+'?'+q,{headers:HDR,cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function parse(v){if(typeof v!=='string')return v;try{return JSON.parse(v);}catch(e){return null;}}
function fakeSnaps(){var o=[];for(var i=14;i>=1;i--){var d=new Date(Date.now()-i*864e5),k=1+i*0.01;
  o.push({day:ymd(d),data:{kp_portfolio:99e6-i*1.2e6,pros_n:10-(i>7?2:0),kp_new30:4+(i%3),c_rem:69.4e6*k,c_over:24e6-i*0.3e6,c_total:129e6,c_paid:59.6e6/k,c_noterm:36.3e6,objects:{'Панфилова':{rem:9.1e6}}}});}return o;}
function load(){
  var keys=['vpk_contracts_v3'];
  return Promise.all([
    get('select=key,value&key=in.('+keys.join(',')+')'),
    get('select=key,value&key=like.kptracker_req_*'),
    get('select=key,value&key=in.(kptracker_prospects,kptracker_managers)'),
    fetch(SNAP+'?select=day,data&order=day.desc&limit=90',{headers:HDR,cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];})
  ]).then(function(r){
    var D={};
    r[0].forEach(function(x){D[x.key]=parse(x.value);});
    D.reqs=r[1].map(function(x){return parse(x.value);}).filter(function(q){return q&&!q._del;});
    var kv={};r[2].forEach(function(x){kv[x.key]=parse(x.value);});
    D.pros=(kv.kptracker_prospects||[]).filter(function(p){return !p._del;});
    D.managers=(kv.kptracker_managers||[]).filter(function(m){return !m._del;}).map(function(m){return m.name;});
    D.snaps=(r[3]||[]).slice().reverse(); // по возрастанию даты
    if(Q.get('test')==='trends'&&!D.snaps.length)D.snaps=fakeSnaps(); // только для проверки вида трендов
    return D;
  });
}

/* ================= расчёты ================= */
function stageSince(q){
  if(q.stageAt)return q.stageAt;var h=q.history||[];
  for(var i=h.length-1;i>=0;i--)if(STAGE_CHANGE_RE.test(h[i].action||''))return h[i].at;
  return q.createdAt;
}
function stageClosed(q){return q.stage==='rejected'||(q.stage==='accepted'&&!!q.kpGenerated);}
function qAmount(q){return num(q.finalAmount)||num(q.amount);}

function compute(D){
  var M={now:new Date()};
  var wNow=isoWeek(M.now);M.week=wNow;

  /* --- КП --- */
  var reqs=D.reqs;M.reqs=reqs;
  var byStage={};STAGE_ORDER.forEach(function(s){byStage[s]={n:0,sum:0};});
  reqs.forEach(function(q){var s=byStage[q.stage]||(byStage[q.stage]={n:0,sum:0});s.n++;s.sum+=qAmount(q);});
  M.byStage=byStage;
  M.kpActive=reqs.filter(function(q){return q.stage!=='rejected'&&q.stage!=='accepted';}).length;
  var att=[];
  reqs.forEach(function(q){
    var name=q.customer||'—',subj=q.subject||'';
    if(!stageClosed(q)&&STAGE_SLA_DAYS[q.stage]){
      var d=Math.max(0,-daysFrom(new Date(stageSince(q)))),sla=STAGE_SLA_DAYS[q.stage];
      if(d>sla)att.push({q:q,lvl:d>sla*2?'bad':'warn',w:d-sla+(d>sla*2?100:0),m:name,s:subj,r:STAGE[q.stage]+': '+d+' '+plural(d,'день','дня','дней')+' (норма '+sla+')'});
    }
    if(q.kpDueDate&&!q.kpGenerated&&q.stage!=='rejected'){
      var k=daysFrom(parseDate(q.kpDueDate));
      if(k<=3)att.push({q:q,lvl:k<0?'bad':'warn',w:k<0?200-k:50-k,m:name,s:subj,r:'КП отправить '+(k<0?'— просрочено на '+(-k)+' '+plural(-k,'день','дня','дней'):relDays(k))});
    }
    if(q.nextContactDate&&q.stage!=='rejected'){
      var c=daysFrom(parseDate(q.nextContactDate));
      if(c<=1)att.push({q:q,lvl:c<0?'bad':'acc',w:c<0?150-c:40,m:name,s:subj,r:'Контакт с заказчиком: '+relDays(c)});
    }
  });
  att.sort(function(a,b){return b.w-a.w;});M.kpAttention=att;
  var pc={};D.pros.forEach(function(p){var s=PROS[p.status]||p.status||'—';pc[s]=(pc[s]||0)+1;});
  M.pros=D.pros.length;M.prosBy=pc;
  var rej={};reqs.forEach(function(q){if(q.stage==='rejected'){var r=q.declineReason||q.rejectionReason||'Причина не указана';rej[r]=(rej[r]||0)+1;}});M.rej=rej;
  var c30=reqs.filter(function(q){return q.createdAt&&daysFrom(new Date(q.createdAt))>=-30;}).length;M.kpNew30=c30;

  /* --- договоры с исполнителями --- */
  var cs=(D.vpk_contracts_v3||[]).filter(function(c){return !EXCLUDED[c.sign_status];});
  var bw={},bc={},tot=0,paid=0,rem=0,over=0,thisW=0,nextW=0,thisN=0,nextN=0,byObj={},wk=[];
  cs.forEach(function(c){
    var ds=(c.ds||[]).reduce(function(a,s){return a+num(s.ds_amount);},0);
    tot+=num(c.amount)+ds;
    var obj=(c.object||'—').trim();var o=byObj[obj]||(byObj[obj]={rem:0,over:0,n:0,tot:0,paid:0,noterm:0,cond:0,who:{},bases:{},unsigned:0});o.n++;
    o.tot+=num(c.amount)+ds;if(c.contractor)o.who[c.contractor.trim()]=1;if(c.customer_contract)o.bases[c.customer_contract.trim()]=(o.bases[c.customer_contract.trim()]||0)+1;
    if(c.sign_status!=='Подписан')o.unsigned++;
    (c.payments||[]).forEach(function(p){
      var r=num(p.remainder);paid+=num(p.paid);rem+=r;o.rem+=r;o.paid+=num(p.paid);
      var mm=String(p.week||'').match(/\d+/);if(r>0&&!mm){if(String(p.week||'').trim())o.cond+=r;else o.noterm+=r;}
      var m=String(p.week||'').match(/\d+/);
      if(r>0){var cond=m?(+m[0]<wNow?'Срок по графику прошёл':'Неделя '+m[0]+' и позже'):(String(p.week||'').trim()?'Условие: '+String(p.week).trim().toLowerCase().replace(/^exon$/,'экзон'):'Срок не указан');
        if(m&&+m[0]>=wNow)cond='Будущие недели';bc[cond]=(bc[cond]||0)+r;}
      if(m&&r>0){var ww=+m[0];bw[ww]=bw[ww]||{w:ww,r:0,n:0,objs:{}};bw[ww].r+=r;bw[ww].n++;bw[ww].objs[obj]=(bw[ww].objs[obj]||0)+r;}
      if(m&&r>0){var w=+m[0];
        if(w<wNow){over+=r;o.over+=r;}
        else if(w===wNow){thisW+=r;thisN++;wk.push({obj:obj,r:r,w:w});}
        else if(w===wNow+1){nextW+=r;nextN++;wk.push({obj:obj,r:r,w:w});}
      }
    });
  });
  M.cn=cs.length;M.cTot=tot;M.cPaid=paid;M.cRem=rem;M.cOver=over;
  M.byWeek=Object.keys(bw).map(function(k){return bw[k];}).sort(function(a,b){return a.w-b.w;});
  M.byCond=Object.keys(bc).map(function(k){return{n:k,r:bc[k]};}).sort(function(a,b){return b.r-a.r;});
  M.thisW=thisW;M.nextW=nextW;M.thisN=thisN;M.nextN=nextN;
  M.objects=Object.keys(byObj).map(function(k){var o=byObj[k];return{n:k,rem:o.rem,over:o.over,c:o.n,tot:o.tot,paid:o.paid,noterm:o.noterm,cond:o.cond,who:Object.keys(o.who).length,unsigned:o.unsigned,
    base:Object.keys(o.bases).sort(function(a,b){return o.bases[b]-o.bases[a];})[0]||''};}).filter(function(x){return x.rem>0;}).sort(function(a,b){return b.rem-a.rem;});
  M.objTop=Object.keys(byObj).map(function(k){return{n:k,rem:byObj[k].rem,over:byObj[k].over,c:byObj[k].n};}).filter(function(x){return x.rem>0;}).sort(function(a,b){return b.rem-a.rem;});
  var wo={};wk.forEach(function(x){var k=x.obj+'|'+x.w;wo[k]=wo[k]||{obj:x.obj,w:x.w,r:0};wo[k].r+=x.r;});
  M.weekPays=Object.keys(wo).map(function(k){return wo[k];}).sort(function(a,b){return a.w-b.w||b.r-a.r;});

  /* --- лента событий --- */
  var ev=[];
  reqs.forEach(function(q){(q.history||[]).forEach(function(h){if(h.at)ev.push({t:new Date(h.at),m:q.customer||'Заявка КП',s:h.action,k:'КП'});});});
  ev=ev.filter(function(e){return e.t<=new Date(Date.now()+864e5);}).sort(function(a,b){return b.t-a.t;});
  M.events=ev.slice(0,7);
  var fin=M.byStage.accepted.n+M.byStage.rejected.n;M.conv=fin?Math.round(M.byStage.accepted.n/fin*100):null;
  /* --- менеджеры (клиентский менеджер заявки и ответственный по лиду) --- */
  var MG={};function mg(n){n=(n||'').trim()||'Не назначен';return MG[n]||(MG[n]={n:n,work:0,acc:0,accSum:0,rej:0,new30:0,att:0,attBad:0,pros:0,next:null,st:{}});}
  (D.managers||[]).forEach(mg);
  reqs.forEach(function(q){var m=mg(q.clientManager);m.st[q.stage]=(m.st[q.stage]||0)+1;
    if(q.stage==='accepted'){m.acc++;m.accSum+=qAmount(q);}else if(q.stage==='rejected')m.rej++;else m.work++;
    if(q.createdAt&&daysFrom(new Date(q.createdAt))>=-30)m.new30++;
    if(q.nextContactDate&&q.stage!=='rejected'){var d=parseDate(q.nextContactDate);if(d&&(!m.next||d<m.next.d))m.next={d:d,c:q.customer};}});
  att.forEach(function(a){var m=mg(a.q.clientManager);m.att++;if(a.lvl==='bad')m.attBad++;});
  D.pros.forEach(function(p){mg(p.responsibleManager).pros++;});
  M.managers=Object.keys(MG).map(function(k){return MG[k];}).sort(function(a,b){return (a.n==='Не назначен')-(b.n==='Не назначен')||(b.work+b.acc+b.pros)-(a.work+a.acc+a.pros);});
  M.snaps=D.snaps||[];
  M.kpLast=ev.filter(function(e){return e.k==='КП';})[0];
  return M;
}

/* ================= отрисовка ================= */
function tile(cls,big,unit,lbl,sub,tr){return '<div class="card tile '+(cls||'')+'">'+(tr||'')+'<div class="big num">'+big+(unit?'<span class="u">'+unit+'</span>':'')+'</div><div class="lbl">'+lbl+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
/* История из ежедневных снимков: точки до вчера + живое значение на сегодня; сравнение с днём ≥7 дней назад
   (если истории меньше недели — с самым ранним снимком). get(data) → число или undefined. */
function snapHist(get,live){
  var S=(M&&M.snaps)||[],today=ymd(new Date()),target=ymd(new Date(Date.now()-7*864e5));
  var pts=[];S.forEach(function(x){if(x.day<today&&x.data){var v=get(x.data);if(v!=null&&!isNaN(v))pts.push({d:x.day,v:+v});}});
  if(!pts.length)return null;
  pts=pts.slice(-29);var ref=null;
  for(var i=pts.length-1;i>=0;i--)if(pts[i].d<=target){ref=pts[i];break;}
  var lbl='за 7 дн.';if(!ref){ref=pts[0];lbl='с '+ref.d.slice(8,10)+'.'+ref.d.slice(5,7);}
  pts.push({d:today,v:live});
  return{pts:pts,dv:live-ref.v,lbl:lbl};
}
function fmtDelta(dv,kind){
  var a=Math.abs(dv);
  var t=kind==='m'?(a>=1e5?(a/1e6).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1})+' млн':Math.round(a/1e3).toLocaleString('ru-RU')+' тыс'):String(Math.round(a));
  return (dv>0?'▲ +':dv<0?'▼ −':'= ')+(dv?t:'без изменений');
}
/* pol: 1 — рост хорошо, -1 — рост плохо, 0 — нейтрально; kind: 'm' — деньги, 'n' — штуки */
function trend(key,live,pol,kind){
  var h=snapHist(function(d){return d[key];},live);if(!h)return '';
  var small=kind==='m'?Math.abs(h.dv)<5e4:h.dv===0;
  var cls=small||!pol?'':(h.dv*pol>0?'good':'bad');
  var svg='';
  if(h.pts.length>=3){
    var mn=Infinity,mx=-Infinity;h.pts.forEach(function(p){mn=Math.min(mn,p.v);mx=Math.max(mx,p.v);});
    var rg=mx-mn||1,n=h.pts.length-1;
    svg='<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline fill="none" stroke="#6F8EF0" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="'+
      h.pts.map(function(p,i){return (i/n*100).toFixed(1)+','+(28-(p.v-mn)/rg*26).toFixed(1);}).join(' ')+'"/></svg>';
  }
  return '<div class="trend">'+svg+'<div class="d '+cls+'">'+fmtDelta(small&&kind==='m'?0:h.dv,kind)+' '+h.lbl+'</div></div>';
}
function objDelta(name,live){
  var h=snapHist(function(d){return d.objects&&d.objects[name]?d.objects[name].rem:undefined;},live);if(!h||Math.abs(h.dv)<5e4)return '';
  return '<span class="pill '+(h.dv<0?'good':'mut')+'">остаток '+fmtDelta(h.dv,'m')+' '+h.lbl+'</span>';
}
function src(t){return '<div class="note">Источник: '+t+'</div>';}

     var nc=m.next?(function(){var k=daysFrom(m.next.d);return '<span class="pill '+(k<0?'bad':k<=1?'warn':'mut')+'">'+fd(m.next.d)+' · '+esc(m.next.c||'')+'</span>';})():'<span class="z">—</span>';
     var z=function(v,x){return v?(x||v):'<span style="color:var(--muted)">0</span>';};
     return '<tr><td>'+esc(m.n)+'</td><td class="l">'+(tot?stk:'<span style="color:var(--muted)">нет заявок</span>')+'</td><td class="num">'+z(m.work)+'</td><td class="num">'+z(m.acc,m.acc+(m.accSum?' · '+money(m.accSum)+' ₽':''))+'</td><td>'+(m.att?'<span class="pill '+(m.attBad?'bad':'warn')+'">'+(m.attBad?'⚠ ':'')+m.att+'</span>':'<span class="pill good">✓ 0</span>')+'</td><td class="num">'+z(m.pros)+'</td><td class="num">'+z(m.new30)+'</td><td>'+nc+'</td></tr>';
   }).join('');
   t+='</table><div class="note">«Требуют внимания» — заявка дольше нормы на этапе, горит срок отправки КП или подошёл контакт с заказчиком. Менеджер — «клиентский менеджер» заявки и «ответственный» по лиду в Трекере КП.</div></div>';
   return t;
 }},

   t+=tile('acc',mln(sum(fut)),'млн ₽','Предстоит по графику','с '+M.week+'-й недели · '+fut.reduce(function(s,x){return s+x.n;},0)+' платежей');
   t+=tile('',mln(sum(cond)),'млн ₽','По условию','после экспертизы, ЭКЗОН, выдачи ПД/РД');
   t+=tile('warn',mln(noTerm),'млн ₽','Срок не указан','в графике платежа нет недели',trend('c_noterm',noTerm,-1,'m'));
   t+='</div><div class="grid" style="grid-template-columns:2.3fr 1fr;flex:1">';

   t+='<div class="cols">'+W.map(function(x){var c=x.w<M.week?'o':x.w===M.week?'now':'';return '<div class="col '+c+'"><div class="v num">'+(x.r<95000?Math.round(x.r/1e3)+'т':mln(x.r))+'</div><div class="c" style="height:'+(x.r/mx*82)+'%"></div></div>';}).join('')+'</div>';
   t+='<div class="wl">'+W.map(function(x){return '<div class="num'+(x.w===M.week?' now':'')+'">'+x.w+'</div>';}).join('')+'</div>';
   t+='<div class="note">Номер под столбцом — неделя оплаты из графика платежей в реестре договоров.</div></div>';
   var big=past.slice().sort(function(a,b){return b.r-a.r;}).slice(0,3);
   t+='<div class="card"><h3>Крупнейшие просроченные недели</h3><div class="list">';
   t+=big.map(function(x){var o=Object.keys(x.objs).sort(function(a,b){return x.objs[b]-x.objs[a];}).slice(0,2);return '<div class="row bad"><div class="m">Неделя '+x.w+'<small>'+esc(o.join(', '))+'</small></div><div class="r num">'+mln(x.r)+' млн</div></div>';}).join('')||'<div class="empty">✓ Просроченных нет</div>';
   t+='</div>';
   if(cond.length)t+='<h3 style="margin-top:calc(22*var(--u))">По условию</h3><div class="list">'+cond.slice(0,4).map(function(x){return '<div class="row acc"><div class="m">'+esc(x.n.replace('Условие: ',''))+'</div><div class="r num">'+mln(x.r)+' млн</div></div>';}).join('')+'</div>';
   t+='</div></div>';

 }},
 {id:'objects',tab:'Объекты',title:'Объекты',fin:true,render:function(M){

];

/* ================= слайдшоу ================= */
var active=SLIDES.filter(function(s){return !(OFFICE&&s.fin);});
var objPage=0,objShown=false;
var cur=FIXED?Math.min(FIXED,active.length)-1:0,paused=!!FIXED,t0=Date.now(),M=null;
var main=document.getElementById('main'),tabs=document.getElementById('tabs');
main.innerHTML=active.map(function(s,i){return '<section class="slide" id="s'+i+'"></section>';}).join('');
tabs.innerHTML=active.map(function(s,i){return '<div class="tab" data-i="'+i+'">'+(s.tab||s.title)+'<div class="p"></div></div>';}).join('');
tabs.addEventListener('click',function(e){var x=e.target.closest('.tab');if(x)show(+x.dataset.i);});

function renderAll(){if(!M)return;active.forEach(function(s,i){try{document.getElementById('s'+i).innerHTML=s.render(M);}catch(e){document.getElementById('s'+i).innerHTML='<div class="empty">Ошибка отрисовки: '+esc(e.message)+'</div>';console.error(e);}});}
function show(i){cur=(i+active.length)%active.length;t0=Date.now();
  active.forEach(function(s,j){document.getElementById('s'+j).classList.toggle('on',j===cur);});
  [].forEach.call(tabs.children,function(el,j){el.classList.toggle('on',j===cur);el.querySelector('.p').style.width='0';});
  var title=active[cur].title;
  if(active[cur].id==='objects'&&M){if(objShown)objPage++;objShown=true;var pages=Math.max(1,Math.ceil(M.objects.length/6));
    document.getElementById('s'+cur).innerHTML=active[cur].render(M);title+=' · '+(objPage%pages+1)+' из '+pages;}
  document.getElementById('htitle').textContent=title;}
function tick(){
  var n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=n.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+' · неделя '+isoWeek(n);
  var p=Math.min(1,(Date.now()-t0)/(SEC*1000));
  var bar=tabs.children[cur]&&tabs.children[cur].querySelector('.p');if(bar)bar.style.width=(paused?0:p*100)+'%';
  if(!paused&&p>=1)show(cur+1);
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);
  else if(e.key===' '){paused=!paused;t0=Date.now();document.getElementById('pause').textContent=paused?'⏸ пауза':'';e.preventDefault();}
  else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen();}
});
var mt;document.addEventListener('mousemove',function(){document.body.classList.add('mouse');clearTimeout(mt);mt=setTimeout(function(){document.body.classList.remove('mouse');},3000);});

/* Всплывающие события: новое в истории заявок КП (по времени записи) и рост «оплачено» по договору.
   Что уже видели — в localStorage этого браузера; при самом первом запуске ничего не всплывает. */
var POP_KEY='vpk_dash_seen_v1',memSeen=null,popQ=[],popBusy=false;
function lsGetJ(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSetJ(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function detectEvents(D){
  var st=lsGetJ(POP_KEY)||memSeen,first=!st,out=[];
  if(first)st={at:new Date().toISOString(),paid:{}};
  var since=st.at,maxAt=since;
  D.reqs.forEach(function(q){(q.history||[]).forEach(function(h){
    if(!h.at||h.at<=since)return;if(h.at>maxAt)maxAt=h.at;
    var a=h.action||'',e=null;
    if(/^Заявка создана/.test(a))e={ic:'🆕',k:'Новая заявка на КП',h:q.customer,s:q.subject};
    else if(/Решение: берём в работу/.test(a))e={ic:'✅',k:'Заявку берём в работу',h:q.customer,s:q.subject,c:'good'};
    else if(/Сформировано коммерческое предложение/.test(a))e={ic:'📄',k:'КП сформировано',h:q.customer,s:q.subject};
    else if(/[Дд]оговор подписан/.test(a))e={ic:'🤝',k:'Договор с заказчиком подписан',h:q.customer,s:q.subject,c:'good'};
    if(e&&!first)out.push(e);
  });});
  var paidNow={};
  (D.vpk_contracts_v3||[]).forEach(function(c){
    if(!c||c.id==null)return;var sum=(c.payments||[]).reduce(function(a,p){return a+num(p.paid);},0);paidNow[c.id]=sum;
    var was=st.paid?st.paid[c.id]:null;
    if(!first&&!OFFICE&&was!=null&&sum-was>=1000)out.push({ic:'💸',k:'Оплата исполнителю отмечена',h:((c.object||'').trim()||'Объект не указан')+' · +'+money(sum-was)+' ₽',s:c.number?'Договор '+c.number:'',c:'good'});
  });
  st={at:maxAt,paid:paidNow};memSeen=st;lsSetJ(POP_KEY,st);
  return out.slice(-6);
}
function pushPop(list){popQ=popQ.concat(list);if(!popBusy)nextPop();}
function nextPop(){
  var e=popQ.shift(),el=document.getElementById('pop');if(!e){popBusy=false;return;}
  popBusy=true;el.className=e.c||'';
  el.innerHTML='<div class="ic">'+e.ic+'</div><div><div class="k">'+esc(e.k)+'</div><div class="h">'+esc(e.h||'—')+'</div>'+(e.s?'<div class="s">'+esc(e.s)+'</div>':'')+'</div>';
  requestAnimationFrame(function(){el.classList.add('on');});
  setTimeout(function(){el.classList.remove('on');setTimeout(nextPop,700);},12000);
}

function refresh(){
  return load().then(function(D){
    var firstLoad=!M;
    M=compute(D);renderAll();if(firstLoad)show(cur);
    pushPop(detectEvents(D));
    if(firstLoad&&Q.get('test')==='popup')pushPop([{ic:'🆕',k:'Новая заявка на КП (пример)',h:'ООО «Пример»',s:'Обследование здания, 2 400 м²'},{ic:'✅',k:'Заявку берём в работу (пример)',h:'ООО «Пример»',s:'ПИР капремонта',c:'good'}]);
    document.getElementById('boot').style.display='none';
    document.getElementById('conn').className='conn';
    document.getElementById('connTxt').textContent='онлайн';
    document.getElementById('upd').textContent='данные обновлены в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+(OFFICE?' · офисный режим':'');
  }).catch(function(e){
    console.error(e);
    document.getElementById('conn').className='conn err';
    document.getElementById('connTxt').textContent='нет связи — показаны последние данные';
    if(!M)document.getElementById('boot').textContent='Не удалось загрузить данные ('+e.message+'). Повтор через минуту…';
  });
}
if(paused)document.getElementById('pause').textContent='⏸ слайд зафиксирован';
refresh();setInterval(refresh,REFRESH_MS);setInterval(tick,250);tick();
setTimeout(function(){location.reload();},RELOAD_MS);
})();
</script>
